<title id="anim-t">AMD HPC accelerator running Mojo kernels to drive a holographic four-nacelle warp-field simulation</title>
<desc id="anim-d">Left: an AMD Instinct-class accelerator card. Center: Mojo kernels (stencil, Laplacian, RK4, diffusion) with the validation record. Right: a holographic display of a vessel with four nacelles generating an expanding warp bubble over a spacetime grid. Labels state that kernel results are documented from August 2026 and the simulation is exploratory mathematics with no physical claim.</desc>
<defs>
  <linearGradient id="gFlow" x1="0" x2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity="0"/><stop offset=".5" stop-color="var(--accent)" stop-opacity="1"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient>
  <radialGradient id="gHolo" cx=".5" cy=".55" r=".7"><stop offset="0" stop-color="#0a2a3a"/><stop offset="1" stop-color="#040c14"/></radialGradient>
  <radialGradient id="gBubble" cx=".5" cy=".5" r=".5"><stop offset=".6" stop-color="#3ee6ff" stop-opacity="0"/><stop offset=".85" stop-color="#3ee6ff" stop-opacity=".35"/><stop offset="1" stop-color="#3ee6ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="gScan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ee6ff" stop-opacity="0"/><stop offset=".5" stop-color="#3ee6ff" stop-opacity=".18"/><stop offset="1" stop-color="#3ee6ff" stop-opacity="0"/></linearGradient>
  <clipPath id="holoClip"><rect x="560" y="40" width="320" height="290" rx="14"/></clipPath>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

@keyframes draw{0%{stroke-dashoffset:28}35%,100%{stroke-dashoffset:0}}
@keyframes reachin{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes trek{to{stroke-dashoffset:-52}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(9px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes trek{to{stroke-dashoffset:-52}}

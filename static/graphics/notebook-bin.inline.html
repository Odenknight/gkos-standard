<figure class="art art-notebook-bin" aria-labelledby="notebook-bin-t notebook-bin-d"><svg viewBox="0 0 760 290" role="img" xmlns="http://www.w3.org/2000/svg"><title id="notebook-bin-t">A waste bin of discarded results beside a shelf where the same results are kept and annotated</title><desc id="notebook-bin-d">On the left a bin labelled USUAL PRACTICE holds discarded papers, captioned the result nobody sees again. On the right a shelf labelled KEPT, ON THE SHELF holds three entries: blocked, wrong environment, corrected, which saved the next person two weeks; failed a limit, precision, f32, which told us exactly where to stop; and inconclusive, not enough data, which still narrows the question.</desc>
<path d="M40 226 h680" stroke="var(--ink-3)" stroke-width="2.5"/>
<g class="bin">
  <path d="M108 140 h120 l-14 86 h-92 z" fill="var(--paper-3)" stroke="var(--ink-3)" stroke-width="2.5"/>
  <rect x="100" y="128" width="136" height="14" rx="4" fill="var(--ink-3)"/>
  <g fill="var(--paper-2)" stroke="var(--ink-3)" stroke-width="1.5" opacity=".8">
    <rect x="126" y="102" width="34" height="26" transform="rotate(-14 143 115)"/>
    <rect x="176" y="106" width="34" height="26" transform="rotate(12 193 119)"/>
  </g>
  <text x="168" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-3)" font-family="var(--display)">USUAL PRACTICE</text>
  <text x="168" y="274" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">the result nobody sees again</text>
</g>
<text x="330" y="180" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink-3)" font-family="var(--display)">vs</text>
<g class="shelf">
  <rect x="416" y="88" width="288" height="138" rx="5" fill="var(--paper-2)" stroke="var(--accent)" stroke-width="2.5"/>
  <path d="M416 138 h288 M416 184 h288" stroke="var(--accent)" stroke-width="2"/>
  <g font-family="var(--mono)" font-size="9.5" fill="var(--ink-2)">
    <text x="432" y="116">blocked · wrong environment · corrected</text>
    <text x="432" y="128" fill="var(--time)">↳ saved the next person two weeks</text>
    <text x="432" y="162">failed a limit · precision · f32</text>
    <text x="432" y="174" fill="var(--time)">↳ told us exactly where to stop</text>
    <text x="432" y="208">inconclusive · not enough data</text>
    <text x="432" y="220" fill="var(--time)">↳ still narrows the question</text>
  </g>
  <text x="560" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent-ink)" font-family="var(--display)">KEPT, ON THE SHELF</text>
  <text x="560" y="256" text-anchor="middle" font-size="10" fill="var(--accent-ink)" font-family="var(--mono)">each one still doing work</text>
</g>
<text x="380" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)" font-family="var(--display)">A negative result is not waste. It is a narrowed question.</text>
</svg><figcaption>A negative result is not waste. It is a narrowed question.</figcaption></figure>

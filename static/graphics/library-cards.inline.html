<figure class="art art-library-cards" aria-labelledby="library-cards-t library-cards-d"><svg viewBox="0 0 760 290" role="img" xmlns="http://www.w3.org/2000/svg"><title id="library-cards-t">A single card catalogue linked by dashed lines to four separate holding institutions</title><desc id="library-cards-d">A card catalogue cabinet labelled ONE CATALOGUE with one drawer open. Dashed teal lines run from it to four boxes: a university with its rules and data, a federal lab with its clearances, a company with its licences, and one person with a hard drive.</desc>

  <g fill="var(--ink-3)"><circle cx="160" cy="93" r="4"/><circle cx="160" cy="137" r="4"/><circle cx="160" cy="207" r="4"/></g>
  <text x="160" y="44" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--accent-ink)" font-family="var(--display)">ONE CATALOGUE</text>
</g>
<g class="lines" stroke="var(--accent)" stroke-width="2" fill="none" stroke-dasharray="5 6">
  <path d="M280 150 C 360 150, 380 84, 470 84"/><path d="M280 150 C 360 150, 380 136, 470 136"/>
  <path d="M280 150 C 360 150, 380 188, 470 188"/><path d="M280 150 C 360 150, 380 240, 470 240"/>
</g>
<g class="holds" font-family="var(--mono)" font-size="10">
  <g><rect x="470" y="66" width="238" height="34" rx="5" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2"/><text x="486" y="88" fill="var(--ink-2)">a university, its rules, its data</text></g>

<text x="380" y="278" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--body)">The catalogue moves. The shelves do not. That is the whole proposal.</text>

@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
<g class="case">
  <rect x="120" y="44" width="520" height="184" rx="6" fill="var(--accent)" opacity=".07"/>
  <rect x="120" y="44" width="520" height="184" rx="6" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <path d="M120 44 L640 44 M120 228 L640 228" stroke="var(--accent)" stroke-width="2"/>
  <g class="glint" stroke="var(--paper)" stroke-width="10" opacity=".35"><path d="M196 44 L120 122"/><path d="M262 44 L120 190"/></g>
</g>
<g class="exhibit">
  <rect x="216" y="82" width="132" height="102" rx="4" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="2"/>
  <g stroke="var(--accent)" stroke-width="2"><path d="M236 106h92M236 126h92M236 146h60"/></g>
  <text x="282" y="200" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="var(--mono)">the experiment record</text>
</g>
<g class="placard">
  <rect x="384" y="82" width="228" height="102" rx="4" fill="var(--paper)" stroke="var(--accent)" stroke-width="2"/>
  <g font-family="var(--mono)" font-size="9" fill="var(--ink-2)">
    <text x="398" y="102">what it is ..... S02-I qualification</text>
    <text x="398" y="118">when run ...... 20 Aug 2026</text>
    <text x="398" y="134">what passed ... parity, float64</text>
    <text x="398" y="150" fill="var(--fail)">what failed ... float32, overall</text>
    <text x="398" y="166" fill="var(--time)">corrected ..... twice, both shown</text>
  </g>
  <text x="498" y="200" text-anchor="middle" font-size="9.5" fill="var(--accent-ink)" font-family="var(--mono)">the placard, not a press release</text>
</g>
<text x="380" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)" font-family="var(--display)">You may look. You may not touch. The label tells the truth.</text>
<text x="380" y="256" text-anchor="middle" font-size="11.5" fill="var(--ink-3)" font-family="var(--body)">A read-only exhibit is not a limitation we apologise for. It is the exhibit's integrity.</text>
<text x="380" y="276" text-anchor="middle" font-size="10" fill="var(--time)" font-family="var(--mono)">status: in development · the exhibit link appears here once verified</text>
</svg>

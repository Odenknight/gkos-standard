<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" role="img" class="art art-map-compass" aria-labelledby="map-compass-t map-compass-d"><title id="map-compass-t">Section mark: Convening map</title><desc id="map-compass-d">A wide header card reading 04 CONVENING MAP, where all of this lands on your agenda, with a compass icon.</desc><style>

<figure class="art art-sbir-scoreboard" aria-labelledby="sbir-scoreboard-t sbir-scoreboard-d"><svg viewBox="0 0 760 280" role="img" xmlns="http://www.w3.org/2000/svg"><title id="sbir-scoreboard-t">A scoreboard with three bars: awards received nearly full, things produced short, uncertainty resolved barely started</title><desc id="sbir-scoreboard-d">A dark scoreboard headed WHAT WE COUNT shows three bars. Awards received is nearly full and marked easy. Things produced is about a quarter and marked harder. Uncertainty resolved is a stub and marked rarely.</desc>
<rect x="70" y="40" width="620" height="190" rx="10" fill="#0e1720" stroke="var(--ink-3)" stroke-width="2.5"/>
<text x="380" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#8ff2ff" font-family="var(--display)">WHAT WE COUNT</text>
<g class="score">
  <g class="row r1">
    <text x="110" y="116" font-size="12" fill="#8ff2ff" font-family="var(--mono)">awards received</text>
    <rect x="330" y="102" width="300" height="20" rx="4" fill="#8ff2ff" opacity=".22"/>
    <rect class="bar" x="330" y="102" width="280" height="20" rx="4" fill="#8ff2ff"/>
    <text x="646" y="117" font-size="12" fill="#8ff2ff" font-family="var(--mono)">easy</text>
  </g>
  <g class="row r2">
    <text x="110" y="156" font-size="12" fill="#ffcc7c" font-family="var(--mono)">things produced</text>
    <rect x="330" y="142" width="300" height="20" rx="4" fill="#ffcc7c" opacity=".22"/>
    <rect class="bar" x="330" y="142" width="86" height="20" rx="4" fill="#ffcc7c"/>
    <text x="646" y="157" font-size="12" fill="#ffcc7c" font-family="var(--mono)">harder</text>
  </g>
  <g class="row r3">
    <text x="110" y="196" font-size="12" fill="#ff8c84" font-family="var(--mono)">uncertainty resolved</text>
    <rect x="330" y="182" width="300" height="20" rx="4" fill="#ff8c84" opacity=".22"/>
    <rect class="bar" x="330" y="182" width="22" height="20" rx="4" fill="#ff8c84"/>
    <text x="646" y="197" font-size="12" fill="#ff8c84" font-family="var(--mono)">rarely</text>
  </g>
</g>
<text x="380" y="256" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--body)">All four readings argue about the top row. The bottom row is the one that compounds.</text>
</svg><figcaption>All four readings argue about the top row. The bottom row compounds.</figcaption></figure>

<figure class="art art-portal-switchboard" aria-labelledby="portal-switchboard-t portal-switchboard-d"><svg viewBox="0 0 760 260" role="img" xmlns="http://www.w3.org/2000/svg"><title id="portal-switchboard-t">A telephone switchboard where an operator has physically joined one caller to one answerer</title><desc id="portal-switchboard-d">A switchboard panel of jack sockets. The top row is labelled who needs something and the bottom row who has it. One teal cable physically joins a socket in each row. An operator figure stands beside it, labelled a person who answers.</desc>

  <circle cx="200" cy="72" r="11"/><circle cx="246" cy="72" r="11"/><circle cx="292" cy="72" r="11"/><circle cx="338" cy="72" r="11"/>
  <circle cx="422" cy="72" r="11"/><circle cx="468" cy="72" r="11"/><circle cx="514" cy="72" r="11"/><circle cx="560" cy="72" r="11"/>
  <circle cx="200" cy="146" r="11"/><circle cx="246" cy="146" r="11"/><circle cx="292" cy="146" r="11"/><circle cx="338" cy="146" r="11"/>
  <circle cx="422" cy="146" r="11"/><circle cx="468" cy="146" r="11"/><circle cx="514" cy="146" r="11"/><circle cx="560" cy="146" r="11"/>
</g>
<path class="cable" d="M246 72 C 280 120, 430 120, 468 146" fill="none" stroke="var(--accent)" stroke-width="4"/>
<circle cx="246" cy="72" r="7" fill="var(--accent)"/><circle cx="468" cy="146" r="7" fill="var(--accent)"/>
<text x="230" y="50" font-size="9" fill="var(--ink-3)" font-family="var(--mono)">who needs something</text>
<text x="424" y="176" font-size="9" fill="var(--ink-3)" font-family="var(--mono)">who has it</text>
<g class="op">
  <circle cx="86" cy="96" r="20" fill="var(--paper-3)" stroke="var(--ink-2)" stroke-width="2.5"/>

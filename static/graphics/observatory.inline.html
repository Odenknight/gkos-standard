<figure class="art art-observatory" aria-labelledby="observatory-t observatory-d"><svg viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title id="observatory-t">A magnifier labelled read-only exhibit over an experiment record showing criterion chips and a three-version correction trail</title><desc id="observatory-d">An experiment card for S02-I shows coloured chips: parity PASS, Float64 PASS, Float32 FAIL, speed UNEVALUATED, overall FAIL. Below runs a version trail from v1 recorded to v2 corrected to v3 current. A large magnifying glass labelled READ-ONLY EXHIBIT hovers over the card.</desc>
<!-- record card under inspection -->
<g class="record">
  <rect x="70" y="40" width="440" height="212" rx="10" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2"/>
  <text x="96" y="70" font-size="11" font-weight="700" fill="var(--ink-3)" font-family="var(--display)">EXPERIMENT S02-I</text>
  <g font-family="var(--mono)" font-size="10">
    <g class="chip c1"><rect x="96" y="86" width="118" height="24" rx="12" fill="var(--pass)" opacity=".16" stroke="var(--pass)"/><text x="155" y="102" text-anchor="middle" fill="var(--pass)">parity PASS</text></g>
    <g class="chip c2"><rect x="224" y="86" width="132" height="24" rx="12" fill="var(--pass)" opacity=".16" stroke="var(--pass)"/><text x="290" y="102" text-anchor="middle" fill="var(--pass)">Float64 PASS</text></g>
    <g class="chip c3"><rect x="366" y="86" width="126" height="24" rx="12" fill="var(--fail)" opacity=".16" stroke="var(--fail)"/><text x="429" y="102" text-anchor="middle" fill="var(--fail)">Float32 FAIL</text></g>
    <g class="chip c4"><rect x="96" y="120" width="150" height="24" rx="12" fill="var(--ink-3)" opacity=".16" stroke="var(--ink-3)"/><text x="171" y="136" text-anchor="middle" fill="var(--ink-3)">speed UNEVALUATED</text></g>
    <g class="chip c5"><rect x="256" y="120" width="120" height="24" rx="12" fill="var(--time)" opacity=".16" stroke="var(--time)"/><text x="316" y="136" text-anchor="middle" fill="var(--time)">overall FAIL</text></g>
  </g>
  <!-- correction trail -->
  <g class="trail" font-family="var(--mono)" font-size="9.5">
    <circle cx="106" cy="176" r="6" fill="var(--ink-3)"/><text x="122" y="180" fill="var(--ink-3)">v1 · recorded</text>
    <path d="M112 176 h58" stroke="var(--ink-3)" stroke-width="1.5"/>
    <circle cx="230" cy="176" r="6" fill="var(--time)"/><text x="246" y="180" fill="var(--time)">v2 · corrected</text>
    <path d="M236 176 h62" stroke="var(--time)" stroke-width="1.5"/>
    <circle cx="358" cy="176" r="6" fill="var(--accent)"/><text x="374" y="180" fill="var(--accent-ink)">v3 · current</text>
  </g>
  <text x="96" y="216" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">nothing was deleted to get here</text>
  <text x="96" y="234" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">every chip opens its own evidence</text>
</g>
<!-- the lens -->
<g class="lens">
  <circle cx="600" cy="128" r="76" fill="var(--accent)" opacity=".07"/>
  <circle cx="600" cy="128" r="76" fill="none" stroke="var(--accent)" stroke-width="5"/>
  <path d="M654 182 l52 52" stroke="var(--accent)" stroke-width="13" stroke-linecap="round"/>
  <g font-family="var(--display)" text-anchor="middle">
    <text x="600" y="118" font-size="12" font-weight="700" fill="var(--accent-ink)">READ-ONLY</text>
    <text x="600" y="140" font-size="12" font-weight="700" fill="var(--accent-ink)">EXHIBIT</text>
  </g>
</g>
<text x="380" y="284" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--body)">Under development. The exhibit will be labelled replay or live, never left ambiguous.</text>
</svg><figcaption>Every chip opens its own evidence. Nothing was deleted to get here.</figcaption></figure>

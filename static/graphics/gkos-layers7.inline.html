<figure class="art art-gkos-layers7" aria-labelledby="gkos-layers7-t gkos-layers7-d"><svg viewBox="0 0 760 460" role="img" xmlns="http://www.w3.org/2000/svg"><title id="gkos-layers7-t">The GKOS seven-layer model as a stack from Original Sources at the bottom to Authorized Use at the top</title><desc id="gkos-layers7-d">A stack of seven bands. Layer 1 Original Sources, preserve what was received or observed, producing a Source Record. Layer 2 Structure and Identity, stable identity and version history, a Structured Knowledge Object. Layer 3 Relationships and Lineage, support, contradiction, dependency, supersession, assertion and lineage records. Layer 4 Validation and Control, deterministic rules and restrictions, diagnostics and control receipts. Layer 5 Review and Workflow, an authorized disposition, a Decision Record. Layer 6 Context Presentation, reproducible purpose-bound context, a Context Manifest. Layer 7 Authorized Use, binding action to context and authority, an Authorized Use Record. A dashed loop returns from the top to the bottom, labelled a result that comes back enters as new Layer 1.</desc>
<text x="380" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)" font-family="var(--display)">GKOS · seven cumulative responsibilities</text>
<text x="380" y="46" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">not seven products · not a required pipeline · a higher layer never rewrites the ones below</text>

<text x="380" y="414" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--body)">An implementation claims only the responsibilities it actually demonstrates.</text>

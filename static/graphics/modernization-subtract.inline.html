<figure class="art art-modernization-subtract" aria-labelledby="modernization-subtract-t modernization-subtract-d"><svg viewBox="0 0 760 290" role="img" xmlns="http://www.w3.org/2000/svg"><title id="modernization-subtract-t">Two nearly identical tall bars subtracted, leaving a thin sliver that is then shown erased by rounding</title><desc id="modernization-subtract-d">Two tall teal bars of almost identical height, labelled 100.0000004 and 100.0000003, are subtracted. The result is a thin amber sliver labelled the whole answer, 1.0 times ten to the minus seven. Beside it the same sliver is shown as a dashed empty outline struck through, labelled rounded away first, result 0.0.</desc>
<g class="bars">
  <rect x="120" y="60" width="90" height="170" fill="var(--accent)" opacity=".8"/>
  <rect x="120" y="52" width="90" height="8" fill="var(--time)"/>
  <text x="165" y="252" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-family="var(--mono)">100.0000004</text>
  <rect x="260" y="60" width="90" height="170" fill="var(--accent)" opacity=".8"/>
  <text x="305" y="252" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-family="var(--mono)">100.0000003</text>
  <text x="236" y="150" text-anchor="middle" font-size="24" font-weight="800" fill="var(--ink-2)" font-family="var(--display)">−</text>
</g>
<text x="398" y="150" text-anchor="middle" font-size="24" font-weight="800" fill="var(--ink-2)" font-family="var(--display)">=</text>
<g class="result">
  <rect x="440" y="52" width="90" height="8" fill="var(--time)"/>
  <text x="485" y="88" text-anchor="middle" font-size="10.5" fill="var(--time)" font-family="var(--mono)">the whole answer</text>
  <text x="485" y="252" text-anchor="middle" font-size="11" fill="var(--time)" font-family="var(--mono)">1.0 × 10⁻⁷</text>
</g>
<g class="rounded">
  <rect x="586" y="52" width="90" height="8" fill="none" stroke="var(--fail)" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M586 76 h90" stroke="var(--fail)" stroke-width="3"/>
  <text x="631" y="100" text-anchor="middle" font-size="10.5" fill="var(--fail)" font-family="var(--mono)">rounded away first</text>
  <text x="631" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="var(--fail)" font-family="var(--mono)">0.0</text>
</g>
<path d="M548 150 h24" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="5 5"/>
<text x="380" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink-2)" font-family="var(--display)">The answer lives in the sliver at the top.</text>
<text x="380" y="280" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--body)">Two large, nearly equal numbers. Everything we wanted was the part rounding discarded.</text>
</svg><figcaption>The answer lives in the sliver rounding discards.</figcaption></figure>

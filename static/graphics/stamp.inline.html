<figure class="art art-stamp" aria-labelledby="stamp-t stamp-d"><svg viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title id="stamp-t">A single FAILED rubber stamp beside a list of five separate criterion-level outcomes from the same run</title><desc id="stamp-d">On the left, a panel titled what the record says holds a large red FAILED stamp and the note everything else is gone. On the right, a panel titled what actually happened lists: both programs agreed 24 of 24, Float64 met the accuracy limit, Float32 did not, speed never measured, decision ship Float64 and study Float32.</desc>
<!-- left: the one-word answer -->
<g class="left">
  <rect x="40" y="50" width="280" height="200" rx="10" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2"/>
  <text x="180" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink-3)" font-family="var(--display)">WHAT THE RECORD SAYS</text>
  <g class="stamp" transform="rotate(-11 180 160)">
    <rect x="80" y="118" width="200" height="84" rx="8" fill="none" stroke="var(--fail)" stroke-width="6"/>
    <text x="180" y="176" text-anchor="middle" font-size="52" font-weight="800" fill="var(--fail)" font-family="var(--display)">FAILED</text>
  </g>
  <text x="180" y="230" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--body)">Everything else is gone.</text>
</g>
<!-- right: what actually happened -->
<g class="right">
  <rect x="400" y="50" width="320" height="200" rx="10" fill="var(--paper-2)" stroke="var(--accent)" stroke-width="2"/>
  <text x="560" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent-ink)" font-family="var(--display)">WHAT ACTUALLY HAPPENED</text>
  <g font-family="var(--mono)" font-size="11">
    <g class="row rw1"><circle cx="424" cy="106" r="5" fill="var(--pass)"/><text x="440" y="110" fill="var(--ink-2)">both programs agreed, 24 of 24</text></g>
    <g class="row rw2"><circle cx="424" cy="132" r="5" fill="var(--pass)"/><text x="440" y="136" fill="var(--ink-2)">Float64 met the accuracy limit</text></g>
    <g class="row rw3"><circle cx="424" cy="158" r="5" fill="var(--fail)"/><text x="440" y="162" fill="var(--ink-2)">Float32 did not</text></g>
    <g class="row rw4"><circle cx="424" cy="184" r="5" fill="var(--ink-3)"/><text x="440" y="188" fill="var(--ink-2)">speed: never measured</text></g>
    <g class="row rw5"><circle cx="424" cy="210" r="5" fill="var(--accent)"/><text x="440" y="214" fill="var(--ink-2)">decision: ship Float64, study Float32</text></g>
  </g>
  <text x="560" y="238" text-anchor="middle" font-size="11" fill="var(--accent-ink)" font-family="var(--body)">Same run. Five different facts.</text>
</g>
<g class="vs"><text x="360" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink-3)" font-family="var(--display)">vs</text></g>
</svg><figcaption>One label, or five facts. Same experiment.</figcaption></figure>

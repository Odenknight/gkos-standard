<figure class="art art-gkos-links" aria-labelledby="gkos-links-t gkos-links-d"><svg viewBox="0 0 760 250" role="img" xmlns="http://www.w3.org/2000/svg"><title id="gkos-links-t">A chain of seven links running from source to action, with the fourth link broken and unlabelled</title><desc id="gkos-links-d">Seven chain links run left to right labelled source, method, result, an unlabelled broken red link marked with a question mark, then claim, decision, action taken. The broken link is annotated the reasoning step, unrecorded.</desc>

  <ellipse cx="110" cy="124" rx="40" ry="26" stroke="var(--accent)"/>
  <ellipse cx="196" cy="124" rx="40" ry="26" stroke="var(--accent)"/>
  <ellipse cx="282" cy="124" rx="40" ry="26" stroke="var(--accent)"/>
  <ellipse class="missing" cx="368" cy="124" rx="40" ry="26" stroke="var(--fail)" stroke-dasharray="10 10"/>
  <ellipse cx="454" cy="124" rx="40" ry="26" stroke="var(--accent)"/>
  <ellipse cx="540" cy="124" rx="40" ry="26" stroke="var(--accent)"/>
  <ellipse cx="626" cy="124" rx="40" ry="26" stroke="var(--accent)"/>

  <text x="368" y="182" fill="var(--fail)">?</text>

</g>
<path d="M368 76 v-26" stroke="var(--fail)" stroke-width="2.5"/>
<text x="368" y="40" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fail)" font-family="var(--display)">the reasoning step, unrecorded</text>
<text x="380" y="222" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--body)">A chain is inspectable only where its links were written down. Reviewers stop here.</text>

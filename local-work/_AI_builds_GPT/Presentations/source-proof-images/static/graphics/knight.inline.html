<figure class="art art-knight" aria-labelledby="knight-t knight-d"><svg viewBox="0 0 760 330" role="img" xmlns="http://www.w3.org/2000/svg"><title id="knight-t">A raised drawbridge over a chasm with a community on one bank and a researcher on the other, and an unattended winch</title><desc id="knight-d">A chasm separates two banks. On the left an armoured helmet with a plume represents a community with real questions. On the right a figure in a graduation cap represents a research partner offering study design, analysis and oversight. A drawbridge hinged on the right bank stands raised at a steep angle so neither side can cross. Its chain runs to a winch on a tower labelled the winch, nobody is turning it.</desc>
<!-- banks -->
<g class="banks">
  <path d="M0 208 H250 V330 H0 Z" fill="var(--paper-3)" stroke="var(--rule)" stroke-width="2"/>
  <path d="M510 208 H760 V330 H510 Z" fill="var(--paper-3)" stroke="var(--rule)" stroke-width="2"/>
</g>
<g class="chasm" stroke="var(--rule)" stroke-width="1.5" opacity=".6">
  <path d="M258 226 v92 M282 240 v78 M306 232 v86 M330 248 v70 M354 236 v82 M378 252 v66 M402 238 v80 M426 246 v72 M450 232 v86 M474 244 v74 M498 230 v88"/>
</g>
<text x="380" y="316" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">no crossing here</text>
<!-- winch tower on the far bank, nobody at it -->
<g class="tower">
  <rect x="578" y="60" width="13" height="150" fill="var(--ink-3)"/>
  <circle cx="584" cy="64" r="15" fill="var(--paper-2)" stroke="var(--ink-3)" stroke-width="3"/>
  <path d="M584 64 l13 9" stroke="var(--ink-3)" stroke-width="4" stroke-linecap="round"/>
  <text x="614" y="52" font-size="10.5" fill="var(--time)" font-family="var(--mono)">the winch</text>
  <text x="614" y="68" font-size="10.5" fill="var(--time)" font-family="var(--mono)">nobody is</text>
  <text x="614" y="82" font-size="10.5" fill="var(--time)" font-family="var(--mono)">turning it</text>
</g>
<!-- the raised drawbridge, hinged on the right bank -->
<g class="bridge">
  <path d="M572 70 L336 36" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="4 4"/>
  <g class="deck">
    <path d="M510 208 L330 28 L346 12 L526 192 Z" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="2.5"/>
    <g stroke="var(--ink-3)" stroke-width="1.5">
      <path d="M356 62 l16 -16 M382 88 l16 -16 M408 114 l16 -16 M434 140 l16 -16 M460 166 l16 -16"/>
    </g>
  </g>
  <circle cx="510" cy="208" r="7" fill="var(--ink-2)"/>
</g>
<!-- community on the left bank -->
<g class="knightfig">
  <path d="M112 132 q0 -44 42 -44 t42 44 v46 q0 34 -42 52 q-42 -18 -42 -52 Z" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="2.5"/>
  <rect x="126" y="130" width="56" height="12" rx="4" fill="var(--ink)"/>
  <g class="plume"><path d="M154 88 q 20 -28 7 -41 q 21 13 11 41 Z" fill="var(--time)"/></g>
  <path d="M196 196 h46" stroke="var(--time)" stroke-width="7" stroke-linecap="round" class="hand h1"/>
  <text x="128" y="250" font-size="11" font-weight="700" fill="var(--ink-2)" font-family="var(--display)">A COMMUNITY</text>
  <text x="128" y="266" font-size="9.5" fill="var(--ink-3)" font-family="var(--body)">and a great many real questions</text>
</g>
<!-- researcher on the right bank -->
<g class="scholar">
  <circle cx="676" cy="148" r="25" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="2.5"/>
  <path d="M640 134 h72 l-36 -19 Z" fill="var(--ink-2)"/><path d="M712 134 v20" stroke="var(--ink-2)" stroke-width="2"/>
  <rect x="657" y="178" width="38" height="30" rx="10" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="2.5"/>
  <path d="M655 192 h-46" stroke="var(--time)" stroke-width="7" stroke-linecap="round" class="hand h2"/>
  <text x="744" y="250" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink-2)" font-family="var(--display)">A RESEARCH PARTNER</text>
  <text x="744" y="266" text-anchor="end" font-size="9.5" fill="var(--ink-3)" font-family="var(--body)">study design, analysis, oversight</text>
</g>
<text x="380" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="var(--time)" font-family="var(--display)">the bridge is up</text>
<text x="380" y="140" text-anchor="middle" font-size="11.5" fill="var(--ink-3)" font-family="var(--body)">Both sides want the crossing.</text>
<text x="380" y="158" text-anchor="middle" font-size="11.5" fill="var(--ink-3)" font-family="var(--body)">The crank is on nobody's side of the river.</text>
</svg><figcaption>The crank is on nobody's side of the river.</figcaption></figure>

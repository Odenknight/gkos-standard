<figure class="art art-fac-board" aria-labelledby="fac-board-t fac-board-d"><svg viewBox="0 0 760 290" role="img" xmlns="http://www.w3.org/2000/svg"><title id="fac-board-t">A matching board with four community questions pinned on one side and an empty dashed area on the other</title><desc id="fac-board-d">A board split down the middle. Left, COMMUNITIES WITH QUESTIONS, carries four pinned cards: why do adults stay or stop coming; what does belonging do for people; who never walks through the door; what would we have to measure. Right, RESEARCHERS WITH METHODS, is an empty dashed area reading no pins on this side, not because nobody would, because nobody runs the board.</desc>
<rect x="60" y="46" width="640" height="190" rx="8" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2.5"/>
<path d="M380 46 v190" stroke="var(--rule)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="220" y="74" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--time)" font-family="var(--display)">COMMUNITIES WITH QUESTIONS</text>
<text x="540" y="74" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--accent-ink)" font-family="var(--display)">RESEARCHERS WITH METHODS</text>
<g class="pins" font-family="var(--mono)" font-size="9">
  <g class="pn"><rect x="88" y="92" width="256" height="26" rx="4" fill="var(--time-soft)" stroke="var(--time)" stroke-width="1.5"/><circle cx="102" cy="105" r="5" fill="var(--time)"/><text x="116" y="109" fill="var(--ink-2)">why do adults stay, or stop coming?</text></g>
  <g class="pn"><rect x="88" y="126" width="256" height="26" rx="4" fill="var(--time-soft)" stroke="var(--time)" stroke-width="1.5"/><circle cx="102" cy="139" r="5" fill="var(--time)"/><text x="116" y="143" fill="var(--ink-2)">what does belonging do for people?</text></g>
  <g class="pn"><rect x="88" y="160" width="256" height="26" rx="4" fill="var(--time-soft)" stroke="var(--time)" stroke-width="1.5"/><circle cx="102" cy="173" r="5" fill="var(--time)"/><text x="116" y="177" fill="var(--ink-2)">who never walks through the door?</text></g>
  <g class="pn"><rect x="88" y="194" width="256" height="26" rx="4" fill="var(--time-soft)" stroke="var(--time)" stroke-width="1.5"/><circle cx="102" cy="207" r="5" fill="var(--time)"/><text x="116" y="211" fill="var(--ink-2)">what would we have to measure?</text></g>
</g>
<g class="empty">
  <rect x="416" y="92" width="256" height="128" rx="6" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="7 8"/>
  <text x="544" y="150" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--mono)">no pins on this side</text>
  <text x="544" y="172" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">not because nobody would</text>
  <text x="544" y="186" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">because nobody runs the board</text>
</g>
<text x="380" y="272" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--body)">A noticeboard is cheap. Somebody has to hang it, and read it, and answer.</text>
</svg><figcaption>A noticeboard is cheap. Somebody has to hang it and answer.</figcaption></figure>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" class="art art-notebook" aria-labelledby="notebook-t notebook-d"><title id="notebook-t">An open notebook whose left page lists what worked and whose right page keeps the failures and a correction, struck through but still legible</title><desc id="notebook-d">An open two-page notebook. The left page, WHAT WORKED, lists the stencil port, Float64 within limits, byte-identical results 24 of 24, and reusable tooling. The right page, WHAT DID NOT, KEPT ANYWAY, shows struck-through but readable entries for the Float32 accuracy miss and a TOOLCHAIN_ABSENT finding with a correction noting the Pixi environment was present, plus unmeasured speed and an overall failed protocol. An eraser sits to one side labelled unused.</desc><style>
svg{--paper:#eef1f5;--paper-2:#f7f8fa;--paper-3:#e2e7ee;--ink:#16202b;--ink-2:#3f4d5c;--ink-3:#6b7987;--rule:#c9d2dc;
--accent:#0e7c78;--accent-ink:#085552;--accent-soft:#d5ecea;--time:#b8620f;--time-soft:#f5e4d0;
--pass:#1f7a3a;--fail:#b8322f;--fail-soft:#f6dcdb;--warn:#a36a00;--block:#5b6572;
--demonstrated:#1f7a3a;--documented:#0e7c78;--in-development:#a36a00;--proposed:#5b6572;
--g-access:#0e7c78;--g-learning:#5b4b8a;
--display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Source Serif 4",Georgia,serif;--mono:"JetBrains Mono",Consolas,monospace;
background:var(--paper)}
@media (prefers-color-scheme:dark){svg{--paper:#0f151c;--paper-2:#161e27;--paper-3:#1f2933;--ink:#e8edf2;--ink-2:#b7c2cd;--ink-3:#8d9aa7;--rule:#2c3946;--accent:#4fc1bb;--accent-ink:#9fe3df;--accent-soft:#12302f;--time:#e0954a;--time-soft:#3a2712;--g-access:#4fc1bb;--g-learning:#a596d6}}
.art-notebook .strike{stroke-dasharray:200;stroke-dashoffset:200;animation:strike 3.4s ease-out infinite}
.art-notebook .s2{animation-delay:.7s}
.art-notebook-bin .shelf{animation:popin .8s ease-out both}
@keyframes walkin{0%{transform:translateX(0);opacity:1}70%{transform:translateX(190px);opacity:0}71%{transform:translateX(0);opacity:0}100%{transform:translateX(0);opacity:1}}

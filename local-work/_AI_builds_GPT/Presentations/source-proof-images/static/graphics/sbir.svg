<!-- the thing on the table -->
<g class="middle">
  <ellipse cx="380" cy="150" rx="118" ry="52" fill="var(--paper-3)" stroke="var(--rule)" stroke-width="2"/>
  <text x="380" y="144" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink-2)" font-family="var(--display)">WHAT DID THE</text>
  <text x="380" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink-2)" font-family="var(--display)">AWARD PRODUCE?</text>
</g>
<!-- four commentators pointing in -->
<g class="voices" font-family="var(--mono)" font-size="9.5">
  <g class="v v1"><rect x="26" y="34" width="190" height="52" rx="8" fill="var(--paper-2)" stroke="var(--accent)" stroke-width="2"/>
    <text x="121" y="54" text-anchor="middle" fill="var(--accent-ink)">"mission infrastructure —</text><text x="121" y="70" text-anchor="middle" fill="var(--accent-ink)">measure many ways"</text>
    <path d="M180 90 L286 128" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5"/></g>
  <g class="v v2"><rect x="544" y="34" width="190" height="52" rx="8" fill="var(--paper-2)" stroke="var(--accent)" stroke-width="2"/>
    <text x="639" y="54" text-anchor="middle" fill="var(--accent-ink)">"open the door to</text><text x="639" y="70" text-anchor="middle" fill="var(--accent-ink)">first-time applicants"</text>
    <path d="M580 90 L476 128" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5"/></g>
  <g class="v v3"><rect x="26" y="216" width="190" height="52" rx="8" fill="var(--paper-2)" stroke="var(--time)" stroke-width="2"/>
    <text x="121" y="236" text-anchor="middle" fill="var(--time)">"graduate firms —</text><text x="121" y="252" text-anchor="middle" fill="var(--time)">cap the lifetime total"</text>
    <path d="M180 212 L286 174" stroke="var(--time)" stroke-width="2" stroke-dasharray="5 5"/></g>
  <g class="v v4"><rect x="544" y="216" width="190" height="52" rx="8" fill="var(--paper-2)" stroke="var(--time)" stroke-width="2"/>
    <text x="639" y="236" text-anchor="middle" fill="var(--time)">"count results,</text><text x="639" y="252" text-anchor="middle" fill="var(--time)">not award totals"</text>
    <path d="M580 212 L476 174" stroke="var(--time)" stroke-width="2" stroke-dasharray="5 5"/></g>
</g>
<text x="380" y="222" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--body)">Four readings. Four disagreements. One shared demand.</text>
<text x="380" y="292" text-anchor="middle" font-size="12" fill="var(--accent-ink)" font-family="var(--body)">Answering it needs a record richer than pass or fail. That is the learning priority, in their words.</text>
</svg>

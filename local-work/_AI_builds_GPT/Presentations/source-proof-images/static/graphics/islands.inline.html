<figure class="art art-islands" aria-labelledby="islands-t islands-d"><svg viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title id="islands-t">Four islands representing a university, a federal lab, a startup and a home lab, connected by bridges over water</title><desc id="islands-d">Four labelled islands sit in water: university keeps its data, fed lab keeps its rules, a startup keeps its IP, and someone's home lab. Amber bridges connect them. Caption: nobody moves, everybody connects.</desc>

  <g><ellipse cx="346" cy="118" rx="52" ry="24" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2"/><text x="346" y="114" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink-2)" font-family="var(--display)">fed lab</text><text x="346" y="128" text-anchor="middle" font-size="8.5" fill="var(--ink-3)" font-family="var(--mono)">keeps its rules</text></g>

<text x="380" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="var(--accent-ink)" font-family="var(--display)">Nobody moves. Everybody connects.</text>
<text x="380" y="242" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--body)">A shared catalog and one small common record. Custody stays home.</text>

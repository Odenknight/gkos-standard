@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes nudge2{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes draw{0%{stroke-dashoffset:28}35%,100%{stroke-dashoffset:0}}
@keyframes reachin{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes trek{to{stroke-dashoffset:-52}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(9px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes trek{to{stroke-dashoffset:-52}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
<g class="span">
  <path d="M40 176 h220" stroke="var(--accent)" stroke-width="18" stroke-linecap="round"/>
  <path d="M500 176 h220" stroke="var(--accent)" stroke-width="18" stroke-linecap="round"/>
  <path d="M260 176 h240" stroke="var(--fail)" stroke-width="18" stroke-linecap="round" stroke-dasharray="14 16" opacity=".55"/>
</g>
<g fill="var(--paper-3)" stroke="var(--rule)" stroke-width="2"><rect x="70" y="188" width="34" height="70"/><rect x="656" y="188" width="34" height="70"/></g>
<text x="150" y="150" text-anchor="middle" font-size="10.5" fill="var(--accent-ink)" font-family="var(--mono)">research</text>
<text x="610" y="150" text-anchor="middle" font-size="10.5" fill="var(--accent-ink)" font-family="var(--mono)">adoption</text>
<text x="380" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fail)" font-family="var(--display)">the span nobody is paid to build</text>
<g class="crew">
  <g fill="var(--time)"><circle cx="300" cy="216" r="11"/><rect x="290" y="230" width="20" height="28" rx="7"/></g>
  <g fill="var(--time)" opacity=".75"><circle cx="344" cy="216" r="11"/><rect x="334" y="230" width="20" height="28" rx="7"/></g>
  <path class="tool" d="M312 208 l18 -14" stroke="var(--time)" stroke-width="5" stroke-linecap="round"/>
  <text x="322" y="272" text-anchor="middle" font-size="9.5" fill="var(--time)" font-family="var(--mono)">two people, evenings</text>
</g>
<text x="380" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink-2)" font-family="var(--display)">Both ends are funded. The middle is a hobby.</text>
</svg>

<figure class="art art-modernization-clocks" aria-labelledby="modernization-clocks-t modernization-clocks-d"><svg viewBox="0 0 760 280" role="img" xmlns="http://www.w3.org/2000/svg"><title id="modernization-clocks-t">Two clocks showing the same time beside a reference clock showing a different time</title><desc id="modernization-clocks-d">Two grey clocks show identical hands, labelled implementation A and implementation B, captioned identical to the second. A third teal clock, labelled the reference clock, shows a clearly different time, with a not-equals sign between them.</desc>
<g class="clk c1">
  <circle cx="180" cy="134" r="86" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="3"/>
  <g stroke="var(--ink-3)" stroke-width="3" stroke-linecap="round"><path d="M180 134 v-52" /><path d="M180 134 l40 22"/></g>
  <circle cx="180" cy="134" r="6" fill="var(--ink-2)"/>
  <text x="180" y="248" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--mono)">implementation A</text>
</g>
<g class="clk c2">
  <circle cx="380" cy="134" r="86" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="3"/>
  <g stroke="var(--ink-3)" stroke-width="3" stroke-linecap="round"><path d="M380 134 v-52"/><path d="M380 134 l40 22"/></g>
  <circle cx="380" cy="134" r="6" fill="var(--ink-2)"/>
  <text x="380" y="248" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--mono)">implementation B</text>
</g>
<text x="280" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="var(--time)" font-family="var(--display)">identical to the second</text>
<g class="clk c3">
  <circle cx="606" cy="134" r="86" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="3"/>
  <g stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round"><path d="M606 134 v-52" transform="rotate(48 606 134)"/><path d="M606 134 l40 22" transform="rotate(48 606 134)"/></g>
  <circle cx="606" cy="134" r="6" fill="var(--accent-ink)"/>
  <text x="606" y="248" text-anchor="middle" font-size="11" fill="var(--accent-ink)" font-family="var(--mono)">the reference clock</text>
</g>
<path d="M478 134 h44" stroke="var(--ink-3)" stroke-width="2.5" stroke-dasharray="6 6"/>
<text x="500" y="112" text-anchor="middle" font-size="22" font-weight="800" fill="var(--fail)" font-family="var(--display)">≠</text>
<text x="380" y="272" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--body)">Two clocks that agree are not therefore correct. Someone has to own the reference.</text>
</svg><figcaption>Two clocks that agree are not therefore correct.</figcaption></figure>

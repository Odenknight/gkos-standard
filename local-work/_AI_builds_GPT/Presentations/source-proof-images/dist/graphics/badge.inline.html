<figure class="art art-badge" aria-labelledby="badge-t badge-d"><svg viewBox="0 0 760 260" role="img" xmlns="http://www.w3.org/2000/svg"><title id="badge-t">Three circles labelled Access, Capacity and Learning connected by dashed lines</title><desc id="badge-d">Three large circles: Access, a way in with a name on it; Capacity, build it, keep it, check it; Learning, keep what actually happened. Dashed lines connect them. Caption: three changes, five years, each one a pilot somebody could fund next quarter.</desc>
<g class="tri">
  <g class="pill p1"><circle cx="150" cy="120" r="72" fill="var(--paper-2)" stroke="var(--g-access,var(--accent))" stroke-width="4"/>
    <text x="150" y="112" text-anchor="middle" font-size="19" font-weight="800" fill="var(--accent-ink)" font-family="var(--display)">ACCESS</text>
    <text x="150" y="136" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">a way in</text>
    <text x="150" y="150" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">with a name on it</text></g>
  <g class="pill p2"><circle cx="380" cy="120" r="72" fill="var(--paper-2)" stroke="var(--time)" stroke-width="4"/>
    <text x="380" y="112" text-anchor="middle" font-size="19" font-weight="800" fill="var(--time)" font-family="var(--display)">CAPACITY</text>
    <text x="380" y="136" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">build it, keep it,</text>
    <text x="380" y="150" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">check it</text></g>
  <g class="pill p3"><circle cx="610" cy="120" r="72" fill="var(--paper-2)" stroke="var(--g-learning,#5b4b8a)" stroke-width="4"/>
    <text x="610" y="112" text-anchor="middle" font-size="19" font-weight="800" fill="var(--g-learning,#5b4b8a)" font-family="var(--display)">LEARNING</text>
    <text x="610" y="136" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">keep what</text>
    <text x="610" y="150" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">actually happened</text></g>
</g>
<g stroke="var(--rule)" stroke-width="2" stroke-dasharray="4 6"><path d="M222 120 h86 M452 120 h86"/></g>
<text x="380" y="232" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--body)">Three changes. Five years. Each one is a pilot somebody could fund next quarter.</text>
</svg><figcaption>The whole position, in three circles.</figcaption></figure>

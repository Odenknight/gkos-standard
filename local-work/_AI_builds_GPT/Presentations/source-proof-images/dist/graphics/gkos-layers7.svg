<!-- re-entry loop -->
<g class="reentry">
  <path d="M686 77 C 726 77, 726 367, 686 367" fill="none" stroke="var(--time)" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#re)"/>
  <text x="706" y="222" text-anchor="middle" font-size="9" fill="var(--time)" font-family="var(--mono)" transform="rotate(90 706 222)">results re-enter at L1</text>
</g>
<defs><marker id="re" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--time)"/></marker></defs>
<text x="380" y="414" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--body)">An implementation claims only the responsibilities it actually demonstrates.</text>
</svg>

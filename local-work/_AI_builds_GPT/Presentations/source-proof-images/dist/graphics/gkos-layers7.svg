  <text x="118" y="331" font-size="9.5" fill="var(--ink-3)" font-family="var(--mono)">stable identity and version history</text>
  <text x="660" y="323" text-anchor="end" font-size="10.5" fill="var(--accent)" font-family="var(--mono)">Structured Knowledge Object</text>
</g>
<g class="lyr l1">
  <rect x="96" y="344" width="576" height="42" rx="6" fill="var(--paper-2)" stroke="var(--accent)" stroke-width="2.5"/>

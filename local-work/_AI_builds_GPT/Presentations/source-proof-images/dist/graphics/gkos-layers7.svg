  <text x="118" y="283" font-size="9.5" fill="var(--ink-3)" font-family="var(--mono)">support, contradiction, dependency, supersession</text>
  <text x="660" y="275" text-anchor="end" font-size="10.5" fill="var(--accent)" font-family="var(--mono)">Assertion and lineage records</text>

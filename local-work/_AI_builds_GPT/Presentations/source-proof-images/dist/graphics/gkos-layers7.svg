  <text x="118" y="379" font-size="9.5" fill="var(--ink-3)" font-family="var(--mono)">preserve what was received or observed</text>
  <text x="660" y="371" text-anchor="end" font-size="10.5" fill="var(--accent)" font-family="var(--mono)">Source Record</text>

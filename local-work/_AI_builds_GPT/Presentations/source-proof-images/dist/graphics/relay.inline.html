<figure class="art art-relay" aria-labelledby="relay-t relay-d"><svg viewBox="0 0 760 260" role="img" xmlns="http://www.w3.org/2000/svg"><title id="relay-t">A relay baton thrown from one runner falls to the ground at the midpoint, because no runner is assigned to the middle leg</title><desc id="relay-d">A runner throws a baton. It arcs across the track and falls to the ground at the midpoint, leaving a shadow where it lands. The middle of the track is empty and marked nobody is standing here. A third runner waits at the far end with an outstretched arm that the baton never reaches.</desc>
<g stroke="var(--ink-3)" stroke-width="2" fill="none"><path d="M30 214h700" stroke-dasharray="2 8"/></g>
<g font-family="var(--display)" font-size="11" fill="var(--ink-3)" text-anchor="middle">
  <text x="120" y="244">DISCOVERY</text><text x="380" y="244">???</text><text x="640" y="244">PROGRAM</text>
</g>
<!-- runner 1, handing off -->
<g class="runner r1" fill="var(--accent)">
  <circle cx="120" cy="96" r="15"/><rect x="108" y="116" width="24" height="52" rx="10"/>
  <path d="M132 130 L178 118" stroke="var(--accent)" stroke-width="9" stroke-linecap="round"/>
  <path d="M112 168 L96 206 M128 168 L146 206" stroke="var(--accent)" stroke-width="9" stroke-linecap="round"/>
</g>
<!-- baton mid-air, falling -->
<g class="baton"><rect x="186" y="112" width="46" height="13" rx="6" fill="var(--time)"/></g>
<!-- the gap -->
<g class="gap">
  <path d="M256 96 h248" stroke="var(--time)" stroke-width="2" stroke-dasharray="6 7"/>
  <text x="380" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="var(--time)" font-family="var(--display)">nobody is standing here</text>
  <text x="380" y="140" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--body)">It gets exactly half way across, every time.</text>
  <ellipse class="shadow" cx="394" cy="214" rx="34" ry="7" fill="var(--time)" opacity=".18"/>
</g>
<!-- runner 3, waiting, arms out -->
<g class="runner r3" fill="var(--ink-3)">
  <circle cx="640" cy="96" r="15"/><rect x="628" y="116" width="24" height="52" rx="10"/>
  <path d="M628 130 L586 118" stroke="var(--ink-3)" stroke-width="9" stroke-linecap="round"/>
  <path d="M632 168 L620 206 M648 168 L662 206" stroke="var(--ink-3)" stroke-width="9" stroke-linecap="round"/>
</g>
</svg><figcaption>It gets exactly half way across, every time.</figcaption></figure>

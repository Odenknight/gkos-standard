<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" class="art art-gkos-boundary" aria-labelledby="gkos-boundary-t gkos-boundary-d"><title id="gkos-boundary-t">A single sharing boundary showing which layers stay inside and exactly what a Context Manifest carries across</title><desc id="gkos-boundary-d">Left panel, STAYS ON THE INSIDE: Layer 1 the original files as received, Layer 2 identity and full version history, Layer 3 every assertion including rejected, Layer 4 raw diagnostics and failures, Layer 5 deliberation and dissent, and trade secrets and personal data; custody, retention and sensitivity remain the holder's responsibility. A locked gate in the middle is marked disclosure equals consequential use. Right panel, CROSSES, Layer 6 Context Manifest: recipient named not the public; purpose, one stated use; expiry, a date not forever; accepted assertions with evidence anchors; contradictions included not filtered; restrictions, what you may not do; omissions, something is withheld here. It is reproducible and can be checked against what was actually held.</desc><style>
svg{--paper:#eef1f5;--paper-2:#f7f8fa;--paper-3:#e2e7ee;--ink:#16202b;--ink-2:#3f4d5c;--ink-3:#6b7987;--rule:#c9d2dc;
--accent:#0e7c78;--accent-ink:#085552;--accent-soft:#d5ecea;--time:#b8620f;--time-soft:#f5e4d0;
--pass:#1f7a3a;--fail:#b8322f;--fail-soft:#f6dcdb;--warn:#a36a00;--block:#5b6572;
--demonstrated:#1f7a3a;--documented:#0e7c78;--in-development:#a36a00;--proposed:#5b6572;
--g-access:#0e7c78;--g-learning:#5b4b8a;
--display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Source Serif 4",Georgia,serif;--mono:"JetBrains Mono",Consolas,monospace;
background:var(--paper)}
@media (prefers-color-scheme:dark){svg{--paper:#0f151c;--paper-2:#161e27;--paper-3:#1f2933;--ink:#e8edf2;--ink-2:#b7c2cd;--ink-3:#8d9aa7;--rule:#2c3946;--accent:#4fc1bb;--accent-ink:#9fe3df;--accent-soft:#12302f;--time:#e0954a;--time-soft:#3a2712;--g-access:#4fc1bb;--g-learning:#a596d6}}
.art-gkos-boundary .thegate{animation:pulse 3s ease-in-out infinite}
.art-gkos-boundary .sr{animation:fadein .45s ease-out both}
.art-gkos-boundary .sr:nth-child(2){animation-delay:.08s}
.art-gkos-boundary .sr:nth-child(3){animation-delay:.16s}
.art-gkos-boundary .sr:nth-child(4){animation-delay:.24s}
.art-gkos-boundary .sr:nth-child(5){animation-delay:.32s}
.art-gkos-boundary .sr:nth-child(6){animation-delay:.4s}
.art-gkos-boundary .cr2{animation:fadein .45s ease-out both}
.art-gkos-boundary .cr2:nth-child(2){animation-delay:.08s}
.art-gkos-boundary .cr2:nth-child(3){animation-delay:.16s}
.art-gkos-boundary .cr2:nth-child(4){animation-delay:.24s}
.art-gkos-boundary .cr2:nth-child(5){animation-delay:.32s}
.art-gkos-boundary .cr2:nth-child(6){animation-delay:.4s}
.art-gkos-boundary .cr2:nth-child(7){animation-delay:.48s}
@keyframes walkin{0%{transform:translateX(0);opacity:1}70%{transform:translateX(190px);opacity:0}71%{transform:translateX(0);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes drop{
 0%{transform:translate(0,0) rotate(0);opacity:1}
 14%{transform:translate(58px,-26px) rotate(140deg);opacity:1}
 30%{transform:translate(128px,-34px) rotate(300deg);opacity:1}
 44%{transform:translate(186px,-4px) rotate(460deg);opacity:1}
 66%{transform:translate(204px,92px) rotate(560deg);opacity:1}
 74%{transform:translate(208px,100px) rotate(575deg);opacity:1}
 92%{transform:translate(208px,100px) rotate(575deg);opacity:0}
 93%{transform:translate(0,0) rotate(0);opacity:0}
 100%{transform:translate(0,0) rotate(0);opacity:1}}
@keyframes land{0%,60%{opacity:0}70%,92%{opacity:.18}93%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes buckle{0%,100%{transform:scaleX(1) scaleY(1)}50%{transform:scaleX(1.14) scaleY(.985)}}
@keyframes press{0%,100%{transform:translateY(-3px);opacity:.55}50%{transform:translateY(2px);opacity:1}}
@keyframes wobble{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes squirt{0%{transform:translateX(-60px);opacity:0}15%{opacity:1}100%{transform:translateX(230px);opacity:.15}}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}30%{opacity:1}100%{transform:translateY(16px);opacity:0}}
@keyframes thump{0%{transform:rotate(-11deg) scale(1.5);opacity:0}12%{transform:rotate(-11deg) scale(1);opacity:1}100%{transform:rotate(-11deg) scale(1);opacity:1}}
@keyframes fadein{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes dashmove{to{stroke-dashoffset:-24}}
@keyframes sway{0%,100%{transform:translateX(0)}50%{transform:translateX(-24px)}}
@keyframes sail{0%{transform:translate(0,0);opacity:0}8%{opacity:1}
 25%{transform:translate(146px,-70px)}50%{transform:translate(290px,-104px)}75%{transform:translate(434px,-70px)}
 94%{opacity:1}100%{transform:translate(568px,0);opacity:0}}
@keyframes shove{0%,100%{transform:translateX(0)}55%{transform:translateX(7px)}}
@keyframes through{
 0%{transform:translateX(232px) scale(1,1);opacity:0}
 6%{opacity:1}
 28%{transform:translateX(250px) scale(1,1)}
 40%{transform:translateX(262px) scale(.55,.42)}
 54%{transform:translateX(280px) scale(.5,.38)}
 66%{transform:translateX(304px) scale(1,1)}
 88%{transform:translateX(470px) scale(1,1);opacity:1}
 96%{transform:translateX(500px) scale(.55,.42);opacity:.5}
 100%{transform:translateX(520px) scale(.5,.38);opacity:0}}
@keyframes bridgetry{0%,72%,100%{transform:rotate(0)}80%{transform:rotate(5deg)}88%{transform:rotate(0)}}
@keyframes reach{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes arrive{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes pull{to{stroke-dashoffset:-40}}
@keyframes fray{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes strike{0%{stroke-dashoffset:200}25%,100%{stroke-dashoffset:0}}
@keyframes popin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes sweep{0%,100%{transform:translate(0,0)}50%{transform:translate(-26px,14px)}}
@keyframes shuffle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes drop2{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes stall{0%,100%{transform:translateY(0)}45%{transform:translateY(-10px)}55%{transform:translateY(-4px)}}
@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes tipA{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}
@keyframes tipB{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes trek{to{stroke-dashoffset:-52}}
@keyframes flag{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{0%,60%{transform:rotate(0)}80%,100%{transform:rotate(90deg)}}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes nudge2{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes draw{0%{stroke-dashoffset:28}35%,100%{stroke-dashoffset:0}}
@keyframes reachin{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes trek{to{stroke-dashoffset:-52}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(9px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes trek{to{stroke-dashoffset:-52}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
<text x="380" y="24" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink)" font-family="var(--display)">One boundary, in detail</text>
<text x="380" y="42" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="var(--mono)">the same rule applies at every crossing, in both directions</text>
<!-- left: stays -->
<g class="stays">
  <rect x="24" y="60" width="300" height="272" rx="10" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2.5"/>
  <text x="174" y="86" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink-2)" font-family="var(--display)">STAYS ON THE INSIDE</text>
  <g font-family="var(--mono)" font-size="10" fill="var(--ink-2)">
    <g class="sr"><circle cx="50" cy="112" r="4" fill="var(--accent)"/><text x="64" y="116">L1 the original files, as received</text></g>
    <g class="sr"><circle cx="50" cy="140" r="4" fill="var(--accent)"/><text x="64" y="144">L2 identity and full version history</text></g>
    <g class="sr"><circle cx="50" cy="168" r="4" fill="var(--accent)"/><text x="64" y="172">L3 every assertion, including rejected</text></g>
    <g class="sr"><circle cx="50" cy="196" r="4" fill="var(--time)"/><text x="64" y="200">L4 raw diagnostics and failures</text></g>
    <g class="sr"><circle cx="50" cy="224" r="4" fill="var(--time)"/><text x="64" y="228">L5 deliberation and dissent</text></g>
    <g class="sr"><circle cx="50" cy="252" r="4" fill="var(--fail)"/><text x="64" y="256" fill="var(--fail)">trade secrets, personal data</text></g>
  </g>
  <text x="174" y="300" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="var(--mono)">custody, retention and sensitivity</text>
  <text x="174" y="314" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="var(--mono)">remain the holder's responsibility</text>
</g>
<!-- the gate -->
<g class="thegate">
  <path d="M368 60 v272" stroke="var(--fail)" stroke-width="3" stroke-dasharray="7 8"/>
  <rect x="344" y="176" width="48" height="44" rx="6" fill="var(--paper)" stroke="var(--fail)" stroke-width="2.5"/>
  <path d="M356 190 v-6 a 12 12 0 0 1 24 0 v6" fill="none" stroke="var(--fail)" stroke-width="2.5"/>
  <rect x="352" y="192" width="32" height="22" rx="3" fill="var(--fail)"/>
  <text x="368" y="252" text-anchor="middle" font-size="9" fill="var(--fail)" font-family="var(--mono)">disclosure =</text>
  <text x="368" y="264" text-anchor="middle" font-size="9" fill="var(--fail)" font-family="var(--mono)">consequential use</text>
</g>
<!-- right: crosses -->
<g class="crosses">
  <rect x="412" y="60" width="324" height="272" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="574" y="86" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--accent-ink)" font-family="var(--display)">CROSSES · L6 CONTEXT MANIFEST</text>
  <g font-family="var(--mono)" font-size="10" fill="var(--ink-2)">
    <g class="cr2"><text x="430" y="116">recipient</text><text x="722" y="116" text-anchor="end" fill="var(--ink-3)">named, not "the public"</text></g>
    <g class="cr2"><text x="430" y="140">purpose</text><text x="722" y="140" text-anchor="end" fill="var(--ink-3)">one stated use</text></g>
    <g class="cr2"><text x="430" y="164">expiry</text><text x="722" y="164" text-anchor="end" fill="var(--ink-3)">a date, not forever</text></g>
    <g class="cr2"><text x="430" y="188">accepted assertions</text><text x="722" y="188" text-anchor="end" fill="var(--ink-3)">with evidence anchors</text></g>
    <g class="cr2"><text x="430" y="212">contradictions</text><text x="722" y="212" text-anchor="end" fill="var(--fail)">included, not filtered</text></g>
    <g class="cr2"><text x="430" y="236">restrictions</text><text x="722" y="236" text-anchor="end" fill="var(--ink-3)">what you may not do</text></g>
    <g class="cr2"><text x="430" y="260">omissions</text><text x="722" y="260" text-anchor="end" fill="var(--time)">"something is withheld here"</text></g>
  </g>
  <text x="574" y="300" text-anchor="middle" font-size="9.5" fill="var(--accent-ink)" font-family="var(--mono)">reproducible: the same manifest can be rebuilt</text>
  <text x="574" y="314" text-anchor="middle" font-size="9.5" fill="var(--accent-ink)" font-family="var(--mono)">and checked against what was actually held</text>
</g>
<text x="380" y="360" text-anchor="middle" font-size="11.5" fill="var(--ink-3)" font-family="var(--body)">The receiver learns what was withheld without learning what it was.</text>
<text x="380" y="382" text-anchor="middle" font-size="11.5" fill="var(--ink-3)" font-family="var(--body)">That is what makes a secret and an open record able to sit in the same system.</text>
</svg>

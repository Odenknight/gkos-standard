<figure class="art art-opensource-jenga" aria-labelledby="opensource-jenga-t opensource-jenga-d"><svg viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title id="opensource-jenga-t">A stacked tower with a single amber block being pulled from the middle</title><desc id="opensource-jenga-d">A tower of stacked blocks. One amber block in the middle row is being drawn out, annotated one maintainer, one burnout, no successor named. Side text: everything above depends on it and does not know its name.</desc>
<g class="tower" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2">
  <rect x="300" y="36" width="160" height="26"/><rect x="300" y="66" width="160" height="26"/>
  <rect x="300" y="96" width="160" height="26"/><rect x="300" y="126" width="160" height="26"/>
  <rect x="300" y="186" width="160" height="26"/><rect x="300" y="216" width="160" height="26"/>
  <rect x="300" y="246" width="160" height="26"/>
</g>
<g class="pulled">
  <rect x="300" y="156" width="52" height="26" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2"/>
  <rect x="408" y="156" width="52" height="26" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2"/>
  <rect class="block" x="356" y="156" width="48" height="26" fill="var(--time)" stroke="var(--time)" stroke-width="2"/>
</g>
<path d="M470 169 h66" stroke="var(--time)" stroke-width="2.5" marker-end="url(#jm)"/>
<defs><marker id="jm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="var(--time)"/></marker></defs>
<text x="546" y="160" font-size="12" font-weight="700" fill="var(--time)" font-family="var(--display)">one maintainer,</text>
<text x="546" y="178" font-size="12" font-weight="700" fill="var(--time)" font-family="var(--display)">one burnout</text>
<text x="546" y="198" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">no successor named</text>
<text x="180" y="100" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--mono)">everything above</text>
<text x="180" y="116" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--mono)">depends on it</text>
<text x="180" y="140" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--mono)">and does not know</text>
<text x="180" y="156" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--mono)">its name</text>
<text x="380" y="292" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--body)">Every dependency graph has a block like this. Nobody budgets for it until it moves.</text>
</svg><figcaption>Every dependency graph has a block like this.</figcaption></figure>

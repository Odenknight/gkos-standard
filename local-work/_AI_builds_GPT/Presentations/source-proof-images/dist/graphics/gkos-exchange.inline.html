<figure class="art art-gkos-exchange" aria-labelledby="gkos-exchange-t gkos-exchange-d"><svg viewBox="0 0 760 420" role="img" xmlns="http://www.w3.org/2000/svg"><title id="gkos-exchange-t">Four organisations sharing across boundaries using Layer 6 Context Manifests while their source records stay private</title><desc id="gkos-exchange-d">Four columns: Research Institution, Government, Corporate, and Private Researcher. Each holds a private block labelled Layers 1 to 5 stay here, listing what never leaves, with custody never transfers. Each emits a Layer 6 manifest and receives with a Layer 7 use receipt. Between the columns are purpose-bound gates. Inside Corporate a locked vault is labelled internal secrets never leave but are declared as an omission. A banner lists what every manifest carries: recipient, purpose, expiry, accepted assertions, evidence anchors, contradictions, warnings, restrictions, declared omissions and versions; and the limits: it cannot widen scope, duration or sensitivity beyond its source, missing sensitivity fails closed, disclosure is a consequential use. A loop shows anything sent back entering as a new Layer 1 source with no inherited standing.</desc>
<text x="380" y="24" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink)" font-family="var(--display)">What crosses an organisational boundary, and what never does</text>
<text x="380" y="42" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="var(--mono)">every crossing is a Layer 6 Context Manifest · the sources themselves stay home</text>

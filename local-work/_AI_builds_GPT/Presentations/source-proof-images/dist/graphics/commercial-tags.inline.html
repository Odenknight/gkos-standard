<figure class="art art-commercial-tags" aria-labelledby="commercial-tags-t commercial-tags-d"><svg viewBox="0 0 760 280" role="img" xmlns="http://www.w3.org/2000/svg"><title id="commercial-tags-t">Two product cards, one fast but unverified and unsellable, one qualified and priceable</title><desc id="commercial-tags-d">Left card, A FAST KERNEL: benchmarks impressive, accuracy record none, who checked the author, with a grey tag reading unsellable. Right card, A QUALIFIED KERNEL: benchmarks not yet run, accuracy record frozen and published, who checked an independent reference, with a teal tag reading has a price.</desc>
<g class="prod p1">
  <rect x="60" y="66" width="270" height="140" rx="8" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2.5"/>
  <text x="195" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink-2)" font-family="var(--display)">A FAST KERNEL</text>
  <g font-family="var(--mono)" font-size="10" fill="var(--ink-3)">
    <text x="84" y="128">benchmarks ..... impressive</text>
    <text x="84" y="148">accuracy record . none</text>
    <text x="84" y="168">who checked .... the author</text>
  </g>
  <g class="tag1" transform="rotate(-6 195 224)">
    <path d="M132 208 h126 l-10 28 h-106 z" fill="var(--paper-3)" stroke="var(--ink-3)" stroke-width="2"/>
    <text x="195" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink-3)" font-family="var(--display)">unsellable</text>
  </g>
</g>
<g class="prod p2">
  <rect x="430" y="66" width="270" height="140" rx="8" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="565" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent-ink)" font-family="var(--display)">A QUALIFIED KERNEL</text>
  <g font-family="var(--mono)" font-size="10" fill="var(--ink-2)">
    <text x="454" y="128">benchmarks ..... not yet run</text>
    <text x="454" y="148">accuracy record . frozen, published</text>
    <text x="454" y="168">who checked .... an independent ref</text>
  </g>
  <g class="tag2" transform="rotate(5 565 224)">
    <path d="M502 208 h126 l-10 28 h-106 z" fill="var(--accent)" stroke="var(--accent)" stroke-width="2"/>
    <text x="565" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="var(--display)">has a price</text>
  </g>
</g>
<text x="380" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)" font-family="var(--display)">Which of these can you put on a purchase order?</text>
<text x="380" y="268" text-anchor="middle" font-size="11.5" fill="var(--ink-3)" font-family="var(--body)">The accuracy record is not overhead on the product. It is the product's only warranty.</text>
</svg><figcaption>The accuracy record is not overhead. It is the only warranty.</figcaption></figure>

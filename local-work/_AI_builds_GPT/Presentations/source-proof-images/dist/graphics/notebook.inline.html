<figure class="art art-notebook" aria-labelledby="notebook-t notebook-d"><svg viewBox="0 0 760 320" role="img" xmlns="http://www.w3.org/2000/svg"><title id="notebook-t">An open notebook whose left page lists what worked and whose right page keeps the failures and a correction, struck through but still legible</title><desc id="notebook-d">An open two-page notebook. The left page, WHAT WORKED, lists the stencil port, Float64 within limits, byte-identical results 24 of 24, and reusable tooling. The right page, WHAT DID NOT, KEPT ANYWAY, shows struck-through but readable entries for the Float32 accuracy miss and a TOOLCHAIN_ABSENT finding with a correction noting the Pixi environment was present, plus unmeasured speed and an overall failed protocol. An eraser sits to one side labelled unused.</desc>

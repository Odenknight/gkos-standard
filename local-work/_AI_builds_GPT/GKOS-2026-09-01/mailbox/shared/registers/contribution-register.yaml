entries:
  - id: CR-01
    title: Refusal Receipt as a governed record
    mechanism: >
      When a control fails or eligibility is not met, the system emits a record identifying
      the requested operation, the policy version evaluated, the failing control, and a
      reason code, and this record is retained with the same sensitivity inheritance as
      an accepted-use record. Refusal is evidence, not absence of evidence.
    gkos_clause: "v0.81 standard/annexes/Authority_and_Refusal_Receipt_Fields.md sec 4 Refusal Receipt; schemas/refusal-receipt.schema.json (verified VR-0009, byte-identical at tag v0.81). Kit cited v0.75 sec 7.4/11, which do not exist as numbered clauses in v0.81."
    gkos_file_path: null
    engine_implementation: >
      GKOS-Engine at commit 650eab4a6752227cae336d7556a57826c22a0d5a emits the NO_ELIGIBLE_RESULTS reason code from src/retrieval/confidence.ts (line 11) and src/retrieval/coordinator.ts (lines 203, 863, 934); fixture contracts/retrieval/gkos-retrieval-1.0.0-draft.2/conformance-fixture.json (line 44) and test/retrieval-temporal.test.mjs (lines 334, 415) exercise it. GKOS-Engine-Lite at 1e1f84c547f610ecae2eb459cba53d3f1d00889c carries the same rule in rust/crates/gkos-retrieval/src/confidence.rs (line 19). This reason code is a retrieval confidence signal on an empty result; it is not an implementation of the gkos-standard Refusal Receipt role, which no Engine record is currently validated against. (VR-0009)
    engine_implementation_note: "Do not say the Engine implements Refusal Receipts. VR-0009."
    fixture_evidence: null
    earliest_evidence: { date: null, artifact: null, digest_sha256: null }

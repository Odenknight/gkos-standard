<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">Where governance middleware belongs</title><desc id="desc">Organizational policies, human authority and identity systems supply inputs to a GKOS implementation. Requests pass from an agent or workflow through an adapter and an enforcement point to a target system. The implementation records evidence in controlled storage for authorized review. An observer alone cannot block effects.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#5E718D"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}</style></defs><rect width="1200" height="730" fill="white"/><text x="35" y="48" font-size="35" fill="#102044" font-weight="700">Where governance middleware belongs</text><text x="35" y="84" font-size="21" fill="#536780" font-weight="400">Proposed deployment pattern - responsibilities can span existing systems</text><rect x="320" y="120" width="560" height="125" rx="16" fill="#F0EEF8" stroke="#A8C4E6" stroke-width="2"/><text x="342" y="158" font-size="25" fill="#102044" font-weight="700">Organizational policy and authority</text><text x="342" y="194" font-size="21" fill="#102044" font-weight="400">Responsible people · identity · grants · policy versions</text><path d="M600 247 V290" fill="none" stroke="#5E718D" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><rect x="35" y="310" width="270" height="152" rx="16" fill="#E7F0FA" stroke="#A8C4E6" stroke-width="2"/><text x="57" y="348" font-size="25" fill="#102044" font-weight="700">Agent / workflow</text><text x="57" y="384" font-size="21" fill="#102044" font-weight="400">Request or proposal</text><text x="57" y="413" font-size="21" fill="#102044" font-weight="400">Evidence references</text><path d="M307 382 H342" fill="none" stroke="#5E718D" stroke-width="3"  marker-end="url(#a)"/><rect x="345" y="300" width="505" height="172" rx="16" fill="#235FA5" stroke="#A8C4E6" stroke-width="2"/><text x="367" y="338" font-size="25" fill="white" font-weight="700">GKOS implementation</text><text x="367" y="374" font-size="21" fill="white" font-weight="400">Bind evidence, context and required review</text><text x="367" y="403" font-size="21" fill="white" font-weight="400">Check authority at the effect boundary</text><text x="367" y="432" font-size="21" fill="white" font-weight="400">Adapter + protected enforcement point</text><path d="M852 382 H888" fill="none" stroke="#5E718D" stroke-width="3"  marker-end="url(#a)"/><rect x="890" y="310" width="275" height="152" rx="16" fill="#EAF5EF" stroke="#A8C4E6" stroke-width="2"/><text x="912" y="348" font-size="25" fill="#102044" font-weight="700">Target system</text><text x="912" y="384" font-size="21" fill="#102044" font-weight="400">Admitted effect</text><text x="912" y="413" font-size="21" fill="#102044" font-weight="400">Outcome or uncertainty</text><path d="M600 475 V520" fill="none" stroke="#5E718D" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><path d="M1027 464 V590 H885" fill="none" stroke="#5E718D" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><rect x="320" y="530" width="560" height="120" rx="16" fill="#F4F7FB" stroke="#A8C4E6" stroke-width="2"/><text x="342" y="568" font-size="25" fill="#102044" font-weight="700">Controlled evidence storage</text><text x="342" y="604" font-size="21" fill="#102044" font-weight="400">Use / refusal / recovery records</text><text x="342" y="633" font-size="21" fill="#102044" font-weight="400">Authorized evidence references</text><text x="35" y="698" font-size="20" fill="#536780" font-weight="400">The protected operation must reject bypass paths. Observation alone cannot enforce a denial.</text></svg>
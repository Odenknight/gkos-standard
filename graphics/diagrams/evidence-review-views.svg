<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">One evidence chain, separate reviews</title><desc id="desc">The same protected evidence can be referenced by separate authorized ISO management, EU applicability and obligation, and NIST risk activity review views. Each view retains its own criteria, missing evidence and decision. Reuse does not establish equivalence or approval.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#5E718D"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}</style></defs><rect width="1200" height="700" fill="white"/><text x="35" y="48" font-size="35" fill="#102044" font-weight="700">Reuse evidence; preserve separate judgments</text><rect x="105" y="102" width="990" height="145" rx="16" fill="#235FA5" stroke="#A8C4E6" stroke-width="2"/><text x="127" y="140" font-size="25" fill="white" font-weight="700">One versioned evidence chain</text><text x="127" y="176" font-size="21" fill="white" font-weight="400">Sources · claims · controls · disposition · context · authority · outcome</text><text x="127" y="205" font-size="21" fill="white" font-weight="400">Protected payloads remain behind authorized access where appropriate</text><path d="M600 249 V294 H210 V332" fill="none" stroke="#5E718D" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><path d="M600 294 V332" fill="none" stroke="#5E718D" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><path d="M600 294 H990 V332" fill="none" stroke="#5E718D" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><rect x="35" y="340" width="350" height="158" rx="16" fill="#F0EEF8" stroke="#A8C4E6" stroke-width="2"/><text x="57" y="378" font-size="25" fill="#102044" font-weight="700">ISO review view</text><text x="57" y="414" font-size="21" fill="#102044" font-weight="400">Management process</text><text x="57" y="443" font-size="21" fill="#102044" font-weight="400">Risk / impact evidence</text><text x="57" y="472" font-size="21" fill="#102044" font-weight="400">Organization retains judgment</text><rect x="425" y="340" width="350" height="158" rx="16" fill="#E7F0FA" stroke="#A8C4E6" stroke-width="2"/><text x="447" y="378" font-size="25" fill="#102044" font-weight="700">EU review view</text><text x="447" y="414" font-size="21" fill="#102044" font-weight="400">Role and applicable obligation</text><text x="447" y="443" font-size="21" fill="#102044" font-weight="400">Oversight / operational evidence</text><text x="447" y="472" font-size="21" fill="#102044" font-weight="400">Responsible party retains duties</text><rect x="815" y="340" width="350" height="158" rx="16" fill="#EAF5EF" stroke="#A8C4E6" stroke-width="2"/><text x="837" y="378" font-size="25" fill="#102044" font-weight="700">NIST review view</text><text x="837" y="414" font-size="21" fill="#102044" font-weight="400">Selected risk activity</text><text x="837" y="443" font-size="21" fill="#102044" font-weight="400">Tests / actions / limitations</text><text x="837" y="472" font-size="21" fill="#102044" font-weight="400">Risk owner retains decisions</text><rect x="105" y="550" width="990" height="106" rx="16" fill="#F4F7FB" stroke="#A8C4E6" stroke-width="2"/><text x="127" y="588" font-size="25" fill="#102044" font-weight="700">Each view declares its own scope, criteria and unresolved evidence</text><text x="127" y="624" font-size="21" fill="#102044" font-weight="400">An evidence link is not a conformity, certification or endorsement decision.</text></svg>
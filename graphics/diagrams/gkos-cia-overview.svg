<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">CIA triad and GKOS functions</title><desc id="desc">Confidentiality protects disclosure through authorization and sensitivity. Integrity preserves evidence and binds decisions to exact context. Availability supports authorized service through queue governance and recovery records. The lower lines of each card identify deployment controls still needed: encryption and access enforcement, protected records and tamper tests, backups and operational recovery. GKOS provides governance across all seven layers, not a guarantee of security or uptime.</desc><rect width="1440" height="1000" fill="white"/><text x="56" y="48" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#536780" font-weight="700" text-anchor="start">SECURITY GOALS → GOVERNED KNOWLEDGE → ACCOUNTABLE USE</text><text x="56" y="100" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#1F2A37" font-weight="700" text-anchor="start">The CIA triad, put into practice with GKOS</text><text x="56" y="139" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#536780" font-weight="400" text-anchor="start">Three objectives guide the controls. GKOS connects evidence, authority, decisions and outcomes.</text><path d="M720 190 L260 408 L1180 408 Z" fill="#F4F7FB" stroke="#B5C4D5" stroke-width="3"/><rect x="563" y="256" width="314" height="100" rx="16" fill="#FFFFFF" stroke="#D5DCE5"/><text x="720" y="297" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#1F2A37" font-weight="700" text-anchor="middle">GKOS</text><text x="720" y="328" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536780" font-weight="400" text-anchor="middle">Governance across all seven layers</text><circle cx="720" cy="190" r="27" fill="#235FA5"/><text x="720" y="199" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF" font-weight="700" text-anchor="middle">C</text><circle cx="260" cy="408" r="27" fill="#36803B"/><text x="260" y="417" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF" font-weight="700" text-anchor="middle">I</text><circle cx="1180" cy="408" r="27" fill="#794DA5"/><text x="1180" y="417" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#FFFFFF" font-weight="700" text-anchor="middle">A</text><text x="770" y="199" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#235FA5" font-weight="700" text-anchor="start">Confidentiality</text><text x="310" y="387" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#36803B" font-weight="700" text-anchor="start">Integrity</text><text x="1130" y="387" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#794DA5" font-weight="700" text-anchor="end">Availability</text><rect x="56" y="465" width="430" height="417" rx="16" fill="#E7F0FA" stroke="#D5DCE5"/><text x="78" y="499" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#235FA5" font-weight="700" text-anchor="start">CONFIDENTIALITY</text><text x="78" y="533" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1F2A37" font-weight="700" text-anchor="start">Who may receive it?</text><text x="78" y="565" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1F2A37" font-weight="400" text-anchor="start">Protect against unauthorized</text><text x="78" y="592" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1F2A37" font-weight="400" text-anchor="start">access and disclosure.</text><text x="78" y="635" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#235FA5" font-weight="700" text-anchor="start">GKOS FUNCTIONS</text><text x="78" y="664" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1F2A37" font-weight="400" text-anchor="start">Authorize before disclosure.</text><text x="78" y="691" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1F2A37" font-weight="400" text-anchor="start">Carry sensitivity and purpose limits.</text><text x="78" y="726" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#235FA5" font-weight="700" text-anchor="start">EVIDENCE</text><text x="78" y="754" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1F2A37" font-weight="400" text-anchor="start">Control / Refusal Receipts</text><text x="78" y="781" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1F2A37" font-weight="400" text-anchor="start">Context and authority records</text><text x="78" y="807" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#235FA5" font-weight="700" text-anchor="start">DEPLOYMENT ADDS</text><text x="78" y="831" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536780" font-weight="400" text-anchor="start">Access enforcement, encryption,</text><text x="78" y="856" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536780" font-weight="400" text-anchor="start">key management and leak tests.</text><rect x="505" y="465" width="430" height="417" rx="16" fill="#EAF5EF" stroke="#D5DCE5"/><text x="527" y="499" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#36803B" font-weight="700" text-anchor="start">INTEGRITY</text><text x="527" y="533" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1F2A37" font-weight="700" text-anchor="start">What changed, and why?</text><text x="527" y="565" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1F2A37" font-weight="400" text-anchor="start">Protect against improper change</text><text x="527" y="592" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1F2A37" font-weight="400" text-anchor="start">or destruction of information.</text><text x="527" y="635" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#36803B" font-weight="700" text-anchor="start">GKOS FUNCTIONS</text><text x="527" y="664" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1F2A37" font-weight="400" text-anchor="start">Preserve evidence and lineage.</text><text x="527" y="691" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1F2A37" font-weight="400" text-anchor="start">Bind decisions to exact context.</text><text x="527" y="726" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#36803B" font-weight="700" text-anchor="start">EVIDENCE</text><text x="527" y="754" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1F2A37" font-weight="400" text-anchor="start">Source and Decision Records</text><text x="527" y="781" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1F2A37" font-weight="400" text-anchor="start">Canonical hashes and change receipts</text><text x="527" y="807" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#36803B" font-weight="700" text-anchor="start">DEPLOYMENT ADDS</text><text x="527" y="831" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536780" font-weight="400" text-anchor="start">Protected storage and trust anchors,</text><text x="527" y="856" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536780" font-weight="400" text-anchor="start">tamper tests and source evaluation.</text><rect x="954" y="465" width="430" height="417" rx="16" fill="#F1ECF8" stroke="#D5DCE5"/><text x="976" y="499" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#794DA5" font-weight="700" text-anchor="start">AVAILABILITY</text><text x="976" y="533" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1F2A37" font-weight="700" text-anchor="start">Can authorized work continue?</text><text x="976" y="565" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1F2A37" font-weight="400" text-anchor="start">Support timely, reliable access</text><text x="976" y="592" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1F2A37" font-weight="400" text-anchor="start">to information and its use.</text><text x="976" y="635" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#794DA5" font-weight="700" text-anchor="start">GKOS FUNCTIONS</text><text x="976" y="664" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1F2A37" font-weight="400" text-anchor="start">Govern queues and record refusals.</text><text x="976" y="691" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1F2A37" font-weight="400" text-anchor="start">Bind outcomes to recovery routes.</text><text x="976" y="726" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#794DA5" font-weight="700" text-anchor="start">EVIDENCE</text><text x="976" y="754" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1F2A37" font-weight="400" text-anchor="start">Use / Refusal Records</text><text x="976" y="781" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1F2A37" font-weight="400" text-anchor="start">Replayable Context Manifests</text><text x="976" y="807" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#794DA5" font-weight="700" text-anchor="start">DEPLOYMENT ADDS</text><text x="976" y="831" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536780" font-weight="400" text-anchor="start">Backups, redundancy, restore tests</text><text x="976" y="856" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536780" font-weight="400" text-anchor="start">and measured service objectives.</text><text x="56" y="925" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1F2A37" font-weight="700" text-anchor="start">Governance records support security objectives. Deployments must enforce and test the outcomes.</text><text x="56" y="960" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#536780" font-weight="400" text-anchor="start">Informative mapping · GKOS v0.81 · NIST FIPS 199 §3 · No security or conformance guarantee</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="826" viewBox="0 0 1280 826" role="img" aria-labelledby="adoption-title adoption-desc">
  <title id="adoption-title">Choose a starting point for your use case</title>
  <desc id="adoption-desc">Four GKOS adoption paths. For read-only display, use the independent Viewer/Projection Profile without decision or action authority. For governed records and decisions, GKOS Core covers GCP-1 through GCP-5. For reproducible decision-support context, use GKOS Core plus the GCP-6 Context-Only Extension, which grants no consequential action authority. For consequential agents and automation, GKOS Advanced covers GCP-1 through GCP-7, binding context and valid authority to action records. A named claim still requires complete applicable evidence; v0.81 currently qualifies no implementation profile.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #102044; }
      .title { font-size: 40px; font-weight: 700; }
      .subtitle { font-size: 23px; fill: #536780; }
      .use { font-size: 23px; font-weight: 700; }
      .profile { font-size: 31px; font-weight: 700; }
      .body { font-size: 23px; }
      .scope { font-size: 23px; font-weight: 700; }
      .note { font-size: 21px; fill: #536780; }
    </style>
  </defs>
  <rect width="1280" height="826" fill="white"/>
  <text x="48" y="62" class="title">Choose a starting point for your use case</text>
  <text x="48" y="100" class="subtitle">Match the governance responsibilities to what your system does.</text>

  <g>
    <rect x="48" y="144" width="576" height="250" rx="18" fill="#F0EEF8" stroke="#C4BADA" stroke-width="2"/>
    <rect x="48" y="162" width="8" height="214" rx="4" fill="#794DA5"/>
    <text x="80" y="184" class="use" style="fill:#704592">Read-only display</text>
    <text x="80" y="233" class="profile">Viewer / Projection Profile</text>
    <text x="80" y="279" class="scope">Independent display profile</text>
    <text x="80" y="325" class="body">Show governed records faithfully.</text>
    <text x="80" y="359" class="body">No decision or action authority.</text>
  </g>
  <g>
    <rect x="656" y="144" width="576" height="250" rx="18" fill="#E7F0FA" stroke="#A8C4E6" stroke-width="2"/>
    <rect x="656" y="162" width="8" height="214" rx="4" fill="#235FA5"/>
    <text x="688" y="184" class="use" style="fill:#235FA5">Records and decisions</text>
    <text x="688" y="233" class="profile">GKOS Core</text>
    <text x="688" y="279" class="scope">GCP-1 through GCP-5</text>
    <text x="688" y="325" class="body">Preserve evidence, apply controls,</text>
    <text x="688" y="359" class="body">and record authorized dispositions.</text>
  </g>
  <g>
    <rect x="48" y="426" width="576" height="268" rx="18" fill="#EAF5EF" stroke="#A6CBB5" stroke-width="2"/>
    <rect x="48" y="444" width="8" height="232" rx="4" fill="#36803B"/>
    <text x="80" y="466" class="use" style="fill:#287244">Context for decision support</text>
    <text x="80" y="515" class="profile" style="font-size:29px">Core + GCP-6 Context-Only</text>
    <text x="80" y="549" class="profile" style="font-size:29px">Extension</text>
    <text x="80" y="607" class="body">Compile reproducible context.</text>
    <text x="80" y="647" class="body">No consequential action authority.</text>
  </g>
  <g>
    <rect x="656" y="426" width="576" height="268" rx="18" fill="#E9F5F5" stroke="#A5CDCD" stroke-width="2"/>
    <rect x="656" y="444" width="8" height="232" rx="4" fill="#177E7B"/>
    <text x="688" y="466" class="use" style="fill:#177E7B">Consequential agents and automation</text>
    <text x="688" y="515" class="profile">GKOS Advanced</text>
    <text x="688" y="563" class="scope">GCP-1 through GCP-7</text>
    <text x="688" y="607" class="body">Bind context and valid authority</text>
    <text x="688" y="647" class="body">to an action and its durable record.</text>
  </g>

  <text x="48" y="754" class="body" style="font-weight:700">Each named claim requires its complete applicable evidence.</text>
  <text x="48" y="791" class="note">v0.81 currently qualifies no implementation profile. See the conformance profiles for exact scope.</text>
</svg>

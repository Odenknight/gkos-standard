<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" class="art art-gkos" aria-labelledby="gkos-t gkos-d"><title id="gkos-t">A claim with four threads running down to its sources, one of which is frayed and attaches to nothing</title><desc id="gkos-d">A card reads THE REWRITE IS CORRECT. Four threads descend to labelled sources: run log dated 2026-08-20, frozen limits set before the run, and an independent reference. The fourth thread is red and broken and ends at a box reading nothing holds this one.</desc><style>

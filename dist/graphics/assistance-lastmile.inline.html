<figure class="art art-assistance-lastmile" aria-labelledby="assistance-lastmile-t assistance-lastmile-d"><svg viewBox="0 0 760 280" role="img" xmlns="http://www.w3.org/2000/svg"><title id="assistance-lastmile-t">A delivery route that is funded most of the way and dashed and undelivered for the final stretch to the recipient</title><desc id="assistance-lastmile-d">A thick teal route runs from a building labelled the lab, captioned research funding reaches this far. A parcel sits at the point where the route turns into a broken red line labelled the last mile, undelivered, before reaching a house captioned someone who needs it.</desc>

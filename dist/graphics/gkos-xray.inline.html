<figure class="art art-gkos-xray" aria-labelledby="gkos-xray-t gkos-xray-d"><svg viewBox="0 0 760 290" role="img" xmlns="http://www.w3.org/2000/svg"><title id="gkos-xray-t">A confident paragraph beside an X-ray view separating its evidenced claims from its unsupported ones</title><desc id="gkos-xray-d">Left panel, WHAT THE READER SEES, holds a four-line quotation claiming the rewrite reproduces the reference and is suitable for production. Right panel, UNDER THE LIGHT, breaks the same text into four bars: two green and evidenced, two red dashed reading suitable for production, nothing, and float32 omitted, hidden.</desc>
<rect x="70" y="30" width="300" height="212" rx="8" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2.5"/>
<text x="220" y="62" text-anchor="middle" font-size="10.5" fill="var(--ink-3)" font-family="var(--mono)">WHAT THE READER SEES</text>
<g font-family="var(--body)" font-size="12" fill="var(--ink-2)">
  <text x="96" y="104">"Our rewrite reproduces</text>
  <text x="96" y="128">the reference implementation</text>
  <text x="96" y="152">and is suitable for</text>
  <text x="96" y="176">production workloads."</text>
</g>
<text x="220" y="214" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">reads as one solid statement</text>
<g class="xr">
  <rect x="404" y="30" width="286" height="212" rx="8" fill="#0d1620" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="547" y="62" text-anchor="middle" font-size="10.5" fill="var(--accent)" font-family="var(--mono)">UNDER THE LIGHT</text>
  <g font-family="var(--mono)" font-size="10.5">
    <g class="bone"><rect x="424" y="80" width="200" height="20" rx="4" fill="var(--pass)" opacity=".28" stroke="var(--pass)"/><text x="432" y="95" fill="var(--pass)">reproduces reference · evidenced</text></g>
    <g class="bone"><rect x="424" y="112" width="152" height="20" rx="4" fill="var(--pass)" opacity=".28" stroke="var(--pass)"/><text x="432" y="127" fill="var(--pass)">24 cases · evidenced</text></g>
    <g class="bone"><rect x="424" y="144" width="236" height="20" rx="4" fill="var(--fail)" opacity=".22" stroke="var(--fail)" stroke-dasharray="4 4"/><text x="432" y="159" fill="var(--fail)">"suitable for production" · nothing</text></g>
    <g class="bone"><rect x="424" y="176" width="176" height="20" rx="4" fill="var(--fail)" opacity=".22" stroke="var(--fail)" stroke-dasharray="4 4"/><text x="432" y="191" fill="var(--fail)">float32 omitted · hidden</text></g>
  </g>
  <text x="547" y="224" text-anchor="middle" font-size="10" fill="var(--accent)" font-family="var(--mono)">two of four claims have no bone behind them</text>
</g>
<text x="380" y="276" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--body)">Provenance is the X-ray. It does not heal anything; it shows you where the breaks are.</text>
</svg><figcaption>Provenance is the X-ray. It shows you where the breaks are.</figcaption></figure>

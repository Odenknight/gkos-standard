<figure class="art art-pathway-waved" aria-labelledby="pathway-waved-t pathway-waved-d"><svg viewBox="0 0 760 280" role="img" xmlns="http://www.w3.org/2000/svg"><title id="pathway-waved-t">A queue where one person is waved out of line and sent back to the end, with no alternative door</title><desc id="pathway-waved-d">Four grey figures queue toward a door labelled INTAKE. An attendant waves one amber figure out of line, saying not this line, and a dashed arrow loops that figure back to the end of the same queue.</desc>
<path d="M40 214 h680" stroke="var(--ink-3)" stroke-width="2.5"/>
<g class="line" fill="var(--ink-3)">
  <g><circle cx="120" cy="164" r="14"/><rect x="108" y="182" width="24" height="32" rx="8"/></g>
  <g><circle cx="190" cy="164" r="14"/><rect x="178" y="182" width="24" height="32" rx="8"/></g>
  <g><circle cx="260" cy="164" r="14"/><rect x="248" y="182" width="24" height="32" rx="8"/></g>
  <g><circle cx="330" cy="164" r="14"/><rect x="318" y="182" width="24" height="32" rx="8"/></g>
</g>
<g class="door">
  <rect x="560" y="80" width="130" height="134" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/>
  <circle cx="672" cy="150" r="4" fill="var(--accent)"/>
  <text x="625" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent-ink)" font-family="var(--display)">INTAKE</text>
</g>
<g class="usher">
  <circle cx="470" cy="150" r="16" fill="var(--paper-3)" stroke="var(--ink-2)" stroke-width="2.5"/>
  <rect x="456" y="172" width="28" height="42" rx="9" fill="var(--paper-3)" stroke="var(--ink-2)" stroke-width="2.5"/>
  <path class="wave" d="M486 176 l34 -18" stroke="var(--ink-2)" stroke-width="6" stroke-linecap="round"/>
  <text x="470" y="106" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="var(--mono)">"not this line"</text>
</g>
<g class="waved">
  <circle cx="404" cy="164" r="14" fill="var(--time)"/><rect x="392" y="182" width="24" height="32" rx="8" fill="var(--time)"/>
  <path class="loop" d="M404 234 C 300 266, 120 266, 106 200" fill="none" stroke="var(--time)" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#lp)"/>
</g>
<defs><marker id="lp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--time)"/></marker></defs>
<text x="380" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="var(--time)" font-family="var(--display)">sent back to the end of a line that has no other door</text>
<text x="380" y="266" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--body)">Being redirected is not the same as being refused. The effect is identical.</text>
</svg><figcaption>Being redirected is not the same as being refused. The effect is identical.</figcaption></figure>

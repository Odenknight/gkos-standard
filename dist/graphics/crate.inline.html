<figure class="art art-crate" aria-labelledby="crate-t crate-d"><svg viewBox="0 0 760 330" role="img" xmlns="http://www.w3.org/2000/svg"><title id="crate-t">A self-storage unit standing open, holding unlabelled research data, with a single padlock and a receipt showing no catalogue and no successor</title><desc id="crate-d">A row of roll-up storage doors. One unit stands open, revealing a dark interior with a drive marked 1.2 GiB and two unlabelled boxes. A single padlock hangs on the open door. A receipt taped beside it reads: rent, personal card; catalogue, none; successor, none. The facade is labelled self-storage unit 07, access 24h, index none.</desc>
<!-- storage facility facade -->
<rect x="30" y="34" width="700" height="226" rx="8" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2.5"/>
<path d="M30 76 h700" stroke="var(--rule)" stroke-width="2"/>
<text x="52" y="62" font-size="12" font-weight="700" fill="var(--ink-3)" font-family="var(--display)">SELF-STORAGE · UNIT 07</text>
<text x="708" y="62" text-anchor="end" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">access 24h · index none</text>
<!-- closed roll-up doors -->
<g class="doors">
  <g><rect x="52" y="96" width="120" height="148" rx="4" fill="var(--paper-3)" stroke="var(--rule)" stroke-width="2"/>
     <g stroke="var(--rule)" stroke-width="1"><path d="M52 118h120M52 140h120M52 162h120M52 184h120M52 206h120M52 228h120"/></g></g>
  <g><rect x="188" y="96" width="120" height="148" rx="4" fill="var(--paper-3)" stroke="var(--rule)" stroke-width="2"/>
     <g stroke="var(--rule)" stroke-width="1"><path d="M188 118h120M188 140h120M188 162h120M188 184h120M188 206h120M188 228h120"/></g></g>
  <g><rect x="596" y="96" width="120" height="148" rx="4" fill="var(--paper-3)" stroke="var(--rule)" stroke-width="2"/>
     <g stroke="var(--rule)" stroke-width="1"><path d="M596 118h120M596 140h120M596 162h120M596 184h120M596 206h120M596 228h120"/></g></g>
</g>
<!-- the open unit -->
<g class="openunit">
  <rect x="324" y="96" width="248" height="148" rx="4" fill="#0d1218" stroke="var(--time)" stroke-width="3"/>
  <g class="rolled" fill="var(--paper-3)" stroke="var(--time)" stroke-width="1.5">
    <rect x="324" y="96" width="248" height="9"/><rect x="324" y="104" width="248" height="9"/><rect x="324" y="112" width="248" height="9"/>
  </g>
  <!-- what is inside -->
  <g class="contents">
    <rect x="356" y="150" width="76" height="62" rx="4" fill="#1b2630" stroke="var(--time)" stroke-width="2"/>
    <g fill="var(--time)" opacity=".8"><rect x="366" y="160" width="56" height="5" rx="2"/><rect x="366" y="172" width="56" height="5" rx="2"/><rect x="366" y="184" width="38" height="5" rx="2"/></g>
    <text x="394" y="228" text-anchor="middle" font-size="10" fill="var(--time)" font-family="var(--mono)">1.2 GiB</text>
    <g fill="#1b2630" stroke="var(--time)" stroke-width="1.5">
      <rect x="452" y="164" width="44" height="48" rx="3"/><rect x="506" y="172" width="44" height="40" rx="3"/>
    </g>
    <text x="500" y="228" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="var(--mono)">unlabelled</text>
  </g>
  <!-- the single padlock and key -->
  <g class="lock" transform="translate(542,124)">
    <path d="M-9 0 v-7 a 9 9 0 0 1 18 0 v7" fill="none" stroke="var(--time)" stroke-width="3"/>
    <rect x="-13" y="0" width="26" height="20" rx="3" fill="var(--time)"/>
  </g>
</g>
<!-- the receipt taped beside it -->
<g class="receipt" transform="rotate(-3 300 288)">
  <rect x="204" y="258" width="196" height="60" rx="4" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="1.5"/>
  <g font-family="var(--mono)" font-size="9.5" fill="var(--ink-3)">
    <text x="216" y="276">rent .......... personal card</text>
    <text x="216" y="290">catalogue ..... none</text>
    <text x="216" y="304">successor ..... none</text>
  </g>
</g>
<text x="500" y="284" text-anchor="middle" font-size="12" fill="var(--time)" font-family="var(--body)">One key. One card. One person who remembers what is in there.</text>
<text x="500" y="306" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--body)">Capacity was never the hard part.</text>
</svg><figcaption>One key, one card, one person who remembers what is in there.</figcaption></figure>

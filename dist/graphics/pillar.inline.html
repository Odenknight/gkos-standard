<figure class="art art-pillar" aria-labelledby="pillar-t pillar-d"><svg viewBox="0 0 760 330" role="img" xmlns="http://www.w3.org/2000/svg"><title id="pillar-t">A sagging slab cracking over a single buckling unfunded support, while four funded pillars hold only the edges</title><desc id="pillar-d">Heavy downward arrows labelled research, industry, government, healthcare and defense press on a wide slab. The slab sags and a red crack opens at its centre. Four thick pillars marked funded stand at the edges and carry none of the middle. A single amber support beneath the centre is visibly buckling under the load, with stress marks, and is labelled one person, unpaid since 2014, carrying the span.</desc>
<!-- the load pressing down -->
<g class="load" stroke="var(--ink-3)" stroke-width="3" fill="none" stroke-linecap="round">
  <path d="M120 18 v34" marker-end="url(#ld)"/><path d="M230 14 v40" marker-end="url(#ld)"/>
  <path d="M380 8 v50" marker-end="url(#ld)"/>
  <path d="M530 14 v40" marker-end="url(#ld)"/><path d="M640 18 v34" marker-end="url(#ld)"/>
</g>
<defs><marker id="ld" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-3)"/></marker></defs>
<text x="380" y="14" text-anchor="middle" font-size="10.5" fill="var(--ink-3)" font-family="var(--mono)">research · industry · government · healthcare · defense</text>
<!-- the slab, sagging over the middle -->
<g class="slab">
  <path d="M50 76 Q 380 112 710 76 L710 128 Q 380 164 50 128 Z" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2.5"/>
  <text x="380" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink-2)" font-family="var(--display)">EVERYTHING BUILT ON TOP OF IT</text>
</g>
<!-- the crack opening above the weak support -->
<g class="crack" stroke="var(--fail)" stroke-width="2.5" fill="none" stroke-linecap="round">
  <path d="M380 95 l-9 13 l11 11 l-9 13 l7 12"/>
  <path d="M352 100 l-10 9" opacity=".7"/><path d="M410 100 l10 9" opacity=".7"/>
</g>
<!-- four funded pillars, straight and solid -->
<g fill="var(--paper-3)" stroke="var(--rule)" stroke-width="2">
  <rect x="88" y="134" width="56" height="130"/><rect x="178" y="141" width="56" height="123"/>
  <rect x="526" y="141" width="56" height="123"/><rect x="616" y="134" width="56" height="130"/>
</g>
<g font-family="var(--mono)" font-size="9" fill="var(--ink-3)" text-anchor="middle">
  <text x="116" y="282">funded</text><text x="206" y="282">funded</text><text x="554" y="282">funded</text><text x="644" y="282">funded</text>
</g>
<!-- the one unfunded support, buckling under the whole middle -->
<g class="twig">
  <path d="M380 146 C 352 184, 410 222, 380 264" stroke="var(--time)" stroke-width="11" fill="none" stroke-linecap="round"/>
  <g class="stress" stroke="var(--fail)" stroke-width="2" stroke-linecap="round">
    <path d="M336 196 l-13 -7"/><path d="M334 208 l-14 3"/>
    <path d="M424 196 l13 -7"/><path d="M426 208 l14 3"/>
  </g>
</g>
<path d="M40 266 h680" stroke="var(--ink-3)" stroke-width="2.5"/>
<!-- callout -->
<g class="callout">
  <path d="M250 212 h56" stroke="var(--time)" stroke-width="2" marker-end="url(#arw)"/>
  <text x="244" y="200" text-anchor="end" font-size="13" font-weight="700" fill="var(--time)" font-family="var(--display)">one person</text>
  <text x="244" y="218" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="var(--body)">unpaid since 2014</text>
  <text x="244" y="236" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="var(--body)">carrying the span</text>
</g>
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--time)"/></marker></defs>
<text x="380" y="300" text-anchor="middle" font-size="12" fill="var(--time)" font-family="var(--body)">Take this one away and the four funded pillars do not hold the middle up.</text>
<text x="380" y="320" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--mono)">load-bearing is not the same as well-supported</text>
</svg><figcaption>Load-bearing is not the same as well-supported.</figcaption></figure>

<figure class="art art-assistance" aria-labelledby="assistance-t assistance-d"><svg viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title id="assistance-t">A prototype passing through a workshop of tests, docs, packaging, security, deployment and replication, coming out usable by others</title><desc id="assistance-d">On the left a dashed box labelled PROTOTYPE, captioned works on my machine. An arrow leads into THE SHOP, containing six labelled benches: tests, docs, packaging, security, deployment and replication, captioned nobody funds this bench today. A second arrow leads out to a checked box labelled USABLE BY OTHERS, captioned works on theirs too.</desc>
<!-- prototype in -->
<g class="proto">
  <rect x="40" y="108" width="126" height="86" rx="8" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2" stroke-dasharray="6 5"/>
  <g class="wobblebox" stroke="var(--ink-3)" stroke-width="2" fill="none"><path d="M64 134 h78 M64 152 h56 M64 170 h68"/></g>
  <text x="103" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-2)" font-family="var(--display)">PROTOTYPE</text>
  <text x="103" y="216" text-anchor="middle" font-size="9.5" fill="var(--time)" font-family="var(--mono)">"works on my machine"</text>
</g>
<path d="M172 150 h48" stroke="var(--accent)" stroke-width="4" marker-end="url(#aw2)"/>
<defs><marker id="aw2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker></defs>

    <g class="tool tl3"><rect x="256" y="136" width="114" height="26" rx="5" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="313" y="153" text-anchor="middle">packaging</text></g>
    <g class="tool tl4"><rect x="390" y="136" width="114" height="26" rx="5" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="447" y="153" text-anchor="middle">security</text></g>
    <g class="tool tl5"><rect x="256" y="172" width="114" height="26" rx="5" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="313" y="189" text-anchor="middle">deployment</text></g>
    <g class="tool tl6"><rect x="390" y="172" width="114" height="26" rx="5" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="447" y="189" text-anchor="middle">replication</text></g>
  </g>
  <text x="380" y="226" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="var(--mono)">nobody funds this bench today</text>
</g>
<path d="M540 150 h48" stroke="var(--accent)" stroke-width="4" marker-end="url(#aw2)"/>
<!-- product out -->
<g class="product">
  <rect x="598" y="108" width="126" height="86" rx="8" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/>

<text x="380" y="276" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--body)">The distance between a working prototype and something others can rely on is engineering, and it costs money.</text>

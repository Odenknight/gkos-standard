<figure class="art art-outcomes-chart" aria-labelledby="outcomes-chart-t outcomes-chart-d"><svg viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title id="outcomes-chart-t">A patient chart reading only the word sick beside a chart showing five separate measured vitals</title><desc id="outcomes-chart-d">Left panel, PATIENT CHART, contains the single word SICK and the note end of chart. Right panel, PATIENT CHART, lists temperature high, pulse fine, oxygen fine, bloodwork not run, and next: treat the fever, retest, each with its own bar.</desc>
<g class="onew">
  <rect x="50" y="52" width="200" height="200" rx="8" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2.5"/>
  <text x="150" y="86" text-anchor="middle" font-size="10.5" fill="var(--ink-3)" font-family="var(--mono)">PATIENT CHART</text>
  <text x="150" y="160" text-anchor="middle" font-size="34" font-weight="800" fill="var(--fail)" font-family="var(--display)">SICK</text>
  <text x="150" y="200" text-anchor="middle" font-size="10.5" fill="var(--ink-3)" font-family="var(--mono)">(end of chart)</text>
</g>
<text x="296" y="158" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink-3)" font-family="var(--display)">vs</text>
<g class="vitals">
  <rect x="342" y="52" width="368" height="200" rx="8" fill="var(--paper-2)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="526" y="80" text-anchor="middle" font-size="10.5" fill="var(--accent-ink)" font-family="var(--mono)">PATIENT CHART</text>
  <g font-family="var(--mono)" font-size="10.5">
    <g class="vr"><text x="366" y="112" fill="var(--ink-3)">temperature</text><rect x="500" y="102" width="120" height="12" rx="6" fill="var(--paper-3)"/><rect x="500" y="102" width="96" height="12" rx="6" fill="var(--fail)"/><text x="634" y="112" fill="var(--fail)">high</text></g>
    <g class="vr"><text x="366" y="142" fill="var(--ink-3)">pulse</text><rect x="500" y="132" width="120" height="12" rx="6" fill="var(--paper-3)"/><rect x="500" y="132" width="62" height="12" rx="6" fill="var(--pass)"/><text x="634" y="142" fill="var(--pass)">fine</text></g>
    <g class="vr"><text x="366" y="172" fill="var(--ink-3)">oxygen</text><rect x="500" y="162" width="120" height="12" rx="6" fill="var(--paper-3)"/><rect x="500" y="162" width="106" height="12" rx="6" fill="var(--pass)"/><text x="634" y="172" fill="var(--pass)">fine</text></g>
    <g class="vr"><text x="366" y="202" fill="var(--ink-3)">bloodwork</text><rect x="500" y="192" width="120" height="12" rx="6" fill="var(--paper-3)"/><text x="634" y="202" fill="var(--ink-3)">not run</text></g>
    <g class="vr"><text x="366" y="232" fill="var(--ink-3)">next</text><text x="500" y="232" fill="var(--time)">treat the fever, retest</text></g>
  </g>
</g>
<text x="380" y="284" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--body)">No clinician would accept the chart on the left. We accept it from experiments daily.</text>
</svg><figcaption>No clinician would accept the chart on the left.</figcaption></figure>

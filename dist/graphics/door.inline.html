<figure class="art art-door" aria-labelledby="door-t door-d"><svg viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title id="door-t">A queue walks into a grand institutional entrance while an independent contributor stands outside holding a working idea</title><desc id="door-d">A large columned building labelled THE INNOVATION SYSTEM has a staff entrance that a queue of affiliated people walk through. To the left, a lone figure holds a box labelled A GOOD IDEA, standing beside a sign reading YOU MUST BE THIS AFFILIATED to enter.</desc>
<g class="ink" fill="none" stroke="var(--ink-3)" stroke-width="2">
  <path d="M40 250h680"/>
</g>
<!-- grand institutional entrance -->
<g class="building">
  <rect x="380" y="70" width="320" height="180" rx="4" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2"/>
  <path d="M370 70 L540 24 L710 70 Z" fill="var(--paper-3)" stroke="var(--rule)" stroke-width="2"/>
  <g fill="var(--paper-3)" stroke="var(--rule)" stroke-width="1.5">
    <rect x="404" y="100" width="18" height="150"/><rect x="452" y="100" width="18" height="150"/>
    <rect x="610" y="100" width="18" height="150"/><rect x="658" y="100" width="18" height="150"/>
  </g>
  <rect x="500" y="140" width="80" height="110" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="568" cy="198" r="3.5" fill="var(--accent)"/>
  <text x="540" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink-2)" font-family="var(--display)">THE INNOVATION SYSTEM</text>
  <text x="540" y="132" text-anchor="middle" font-size="10" fill="var(--accent-ink)" font-family="var(--mono)">STAFF ENTRANCE</text>
</g>
<!-- queue of affiliated people walking in -->
<g class="queue" fill="var(--ink-3)">
  <g class="walker w1"><circle cx="330" cy="196" r="9"/><rect x="323" y="208" width="14" height="30" rx="5"/></g>
  <g class="walker w2"><circle cx="292" cy="196" r="9"/><rect x="285" y="208" width="14" height="30" rx="5"/></g>
  <g class="walker w3"><circle cx="254" cy="196" r="9"/><rect x="247" y="208" width="14" height="30" rx="5"/></g>
</g>
<!-- independent contributor, off to the side, holding a good idea -->
<g class="lone">
  <circle cx="110" cy="188" r="12" fill="var(--time)"/>
  <rect x="100" y="204" width="20" height="40" rx="7" fill="var(--time)"/>
  <g class="idea">
    <rect x="62" y="128" width="96" height="48" rx="8" fill="var(--time-soft)" stroke="var(--time)" stroke-width="2"/>
    <text x="110" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="var(--time)" font-family="var(--display)">A GOOD IDEA</text>
    <text x="110" y="166" text-anchor="middle" font-size="9" fill="var(--ink-3)" font-family="var(--mono)">works. tested. real.</text>
  </g>
</g>
<!-- the sign -->
<g class="sign">
  <rect x="180" y="96" width="150" height="56" rx="6" fill="var(--paper-2)" stroke="var(--ink-3)" stroke-width="2"/>
  <path d="M255 152v78" stroke="var(--ink-3)" stroke-width="3"/>
  <text x="255" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-2)" font-family="var(--display)">YOU MUST BE</text>
  <text x="255" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-2)" font-family="var(--display)">THIS AFFILIATED</text>
  <text x="255" y="147" text-anchor="middle" font-size="9" fill="var(--ink-3)" font-family="var(--mono)">to enter</text>
</g>
<text x="110" y="272" text-anchor="middle" font-size="11" fill="var(--time)" font-family="var(--mono)">eligible · no way in</text>
<text x="540" y="272" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--mono)">affiliated · straight through</text>
</svg><figcaption>Eligible is not the same as admitted.</figcaption></figure>

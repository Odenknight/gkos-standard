<text x="380" y="24" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink)" font-family="var(--display)">What crosses an organisational boundary, and what never does</text>
<text x="380" y="42" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="var(--mono)">every crossing is a Layer 6 Context Manifest · the sources themselves stay home</text>

<g class="ent">
  <rect x="24" y="56" width="160" height="196" rx="9" fill="var(--paper-2)" stroke="var(--accent)" stroke-width="2.5"/>
  <rect x="24" y="56" width="160" height="30" rx="9" fill="var(--accent)" opacity=".16"/>
  <text x="104" y="76" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--accent)" font-family="var(--display)">RESEARCH</text>
  <text x="104" y="88" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--accent)" font-family="var(--display)">INSTITUTION</text>
  <!-- private stack L1-L5 -->
  <rect x="38" y="100" width="132" height="74" rx="5" fill="var(--paper-3)" stroke="var(--rule)" stroke-width="1.5"/>
  <text x="104" y="118" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--ink-2)" font-family="var(--mono)">L1–L5 stay here</text>
  <text x="104" y="134" text-anchor="middle" font-size="8.5" fill="var(--ink-3)" font-family="var(--mono)">raw data, drafts,</text>
  <text x="104" y="146" text-anchor="middle" font-size="8.5" fill="var(--ink-3)" font-family="var(--mono)">unpublished analysis</text>
  <text x="104" y="164" text-anchor="middle" font-size="8.5" fill="var(--ink-3)" font-family="var(--mono)">custody never transfers</text>
  <!-- L6 emitter -->
  <rect x="38" y="184" width="132" height="26" rx="5" fill="var(--accent)" opacity=".18" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="104" y="201" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--accent)" font-family="var(--mono)">L6 manifest out</text>
  <!-- L7 receiver -->
  <rect x="38" y="216" width="132" height="24" rx="5" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5"/>
  <text x="104" y="232" text-anchor="middle" font-size="9" fill="var(--ink-3)" font-family="var(--mono)">L7 use, receipted</text>
</g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" class="art art-gkos-exchange" aria-labelledby="gkos-exchange-t gkos-exchange-d"><title id="gkos-exchange-t">Four organisations sharing across boundaries using Layer 6 Context Manifests while their source records stay private</title><desc id="gkos-exchange-d">Four columns: Research Institution, Government, Corporate, and Private Researcher. Each holds a private block labelled Layers 1 to 5 stay here, listing what never leaves, with custody never transfers. Each emits a Layer 6 manifest and receives with a Layer 7 use receipt. Between the columns are purpose-bound gates. Inside Corporate a locked vault is labelled internal secrets never leave but are declared as an omission. A banner lists what every manifest carries: recipient, purpose, expiry, accepted assertions, evidence anchors, contradictions, warnings, restrictions, declared omissions and versions; and the limits: it cannot widen scope, duration or sensitivity beyond its source, missing sensitivity fails closed, disclosure is a consequential use. A loop shows anything sent back entering as a new Layer 1 source with no inherited standing.</desc><style>
svg{--paper:#eef1f5;--paper-2:#f7f8fa;--paper-3:#e2e7ee;--ink:#16202b;--ink-2:#3f4d5c;--ink-3:#6b7987;--rule:#c9d2dc;
--accent:#0e7c78;--accent-ink:#085552;--accent-soft:#d5ecea;--time:#b8620f;--time-soft:#f5e4d0;

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" class="art art-modernization-agreement" aria-labelledby="modernization-agreement-t modernization-agreement-d"><title id="modernization-agreement-t">Two panels: HIP and Mojo matched in 24 cases, and Float64 passed reference accuracy while Float32 failed</title><desc id="modernization-agreement-d">Reported results of the 20 August 2026 campaign, S02-I. Test one, agreement: HIP and Mojo, 24 of 24 cases identical, pass, compared output bytes. Test two, accuracy against an independent mathematical reference: Float64 pass, Float32 fail. Overall S02-I: fail. Findings apply to the tested stencil and environment. Neither test proves physical feasibility and this campaign did not qualify speed.</desc><style>
svg{--paper:#eef1f5;--paper-2:#f7f8fa;--paper-3:#e2e7ee;--ink:#16202b;--ink-2:#3f4d5c;--ink-3:#6b7987;--rule:#c9d2dc;
--accent:#0e7c78;--accent-ink:#085552;--accent-soft:#d5ecea;--time:#b8620f;--time-soft:#f5e4d0;
--pass:#1f7a3a;--fail:#b8322f;--fail-soft:#f6dcdb;--warn:#a36a00;--block:#5b6572;
--demonstrated:#1f7a3a;--documented:#0e7c78;--in-development:#a36a00;--proposed:#5b6572;
--g-access:#0e7c78;--g-learning:#5b4b8a;
--display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Source Serif 4",Georgia,serif;--mono:"JetBrains Mono",Consolas,monospace;
background:var(--paper)}
@media (prefers-color-scheme:dark){svg{--paper:#0f151c;--paper-2:#161e27;--paper-3:#1f2933;--ink:#e8edf2;--ink-2:#b7c2cd;--ink-3:#8d9aa7;--rule:#2c3946;--accent:#4fc1bb;--accent-ink:#9fe3df;--accent-soft:#12302f;--time:#e0954a;--time-soft:#3a2712;--g-access:#4fc1bb;--g-learning:#a596d6}}

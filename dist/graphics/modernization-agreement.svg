@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style><rect width="1200" height="680" fill="#101b2c"/><g font-family="Arial, sans-serif" fill="#f4f7fb"><text x="60" y="70" font-size="34" font-weight="bold">Two programs can agree and still miss the target.</text><text x="60" y="112" font-size="20" fill="#b8c8db">Mojo / AMD stencil qualification • S02-I • 20 August 2026</text><rect x="60" y="160" width="520" height="310" rx="18" fill="#1c2e45"/><text x="88" y="205" font-size="22" fill="#72dfc1" font-weight="bold">TEST 1 · AGREEMENT</text><text x="88" y="245" font-size="19">Do both programs give the same answer?</text><text x="88" y="310" font-size="30" fill="#72dfc1">HIP ↔ Mojo</text><text x="88" y="365" font-size="30" fill="#72dfc1">24 / 24 cases identical</text><text x="88" y="420" font-size="20" fill="#b8c8db">PASS · compared output bytes</text><rect x="620" y="160" width="520" height="310" rx="18" fill="#1c2e45"/><text x="648" y="205" font-size="22" fill="#ffcc7c" font-weight="bold">TEST 2 · ACCURACY</text><text x="648" y="245" font-size="19">Does that answer meet the reference limits?</text><text x="648" y="310" font-size="30" fill="#ffcc7c">Float64 · PASS</text><text x="648" y="365" font-size="30" fill="#ffcc7c">Float32 · FAIL</text><text x="648" y="420" font-size="20" fill="#b8c8db">Independent mathematical reference</text><text x="60" y="530" font-size="25" font-weight="bold">Use qualified Float64. Investigate lower precision separately.</text><text x="60" y="575" font-size="20" fill="#b8c8db">Overall S02-I: FAIL • Findings apply to the tested stencil and environment.</text><text x="60" y="612" font-size="20" fill="#b8c8db">Neither test proves physical feasibility. This campaign did not qualify speed.</text></g></svg>

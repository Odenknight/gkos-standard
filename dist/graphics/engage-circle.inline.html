<figure class="art art-engage-circle" aria-labelledby="engage-circle-t engage-circle-d"><svg viewBox="0 0 760 290" role="img" xmlns="http://www.w3.org/2000/svg"><title id="engage-circle-t">Four arms reaching in from the corners toward a single circle labelled one pilot</title><desc id="engage-circle-d">A central circle reads ONE PILOT. Four thick arms reach toward it from the corners, labelled a program officer, a maintainer, a researcher and an investor. Below: the portal, the shop, the records.</desc>
<circle cx="380" cy="146" r="72" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="3"/>
<text x="380" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent-ink)" font-family="var(--display)">ONE</text>
<text x="380" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent-ink)" font-family="var(--display)">PILOT</text>
<g class="arms" stroke-width="12" stroke-linecap="round" fill="none">
  <path class="am a1" d="M120 56 L296 118" stroke="var(--accent)"/>
  <path class="am a2" d="M120 236 L296 174" stroke="var(--accent)"/>
  <path class="am a3" d="M640 56 L464 118" stroke="var(--time)"/>
  <path class="am a4" d="M640 236 L464 174" stroke="var(--accent)"/>
</g>
<g font-family="var(--mono)" font-size="10">
  <text x="104" y="46" text-anchor="end" fill="var(--accent-ink)">a program officer</text>
  <text x="104" y="250" text-anchor="end" fill="var(--accent-ink)">a maintainer</text>
  <text x="656" y="46" fill="var(--time)">a researcher</text>
  <text x="656" y="250" fill="var(--accent-ink)">an investor</text>
</g>
<text x="380" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)" font-family="var(--display)">Nothing here needs all of you.</text>
<text x="380" y="252" text-anchor="middle" font-size="11.5" fill="var(--ink-3)" font-family="var(--body)">Each pilot needs exactly one person from one of these corners to say yes first.</text>
<text x="380" y="274" text-anchor="middle" font-size="10.5" fill="var(--time)" font-family="var(--mono)">the portal · the shop · the records</text>
</svg><figcaption>Each pilot needs one person to say yes first.</figcaption></figure>

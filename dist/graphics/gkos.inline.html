<figure class="art art-gkos" aria-labelledby="gkos-t gkos-d"><svg viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title id="gkos-t">A claim with four threads running down to its sources, one of which is frayed and attaches to nothing</title><desc id="gkos-d">A card reads THE REWRITE IS CORRECT. Four threads descend to labelled sources: run log dated 2026-08-20, frozen limits set before the run, and an independent reference. The fourth thread is red and broken and ends at a box reading nothing holds this one.</desc>
<!-- the claim -->
<g class="claim">
  <rect x="270" y="26" width="220" height="62" rx="8" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="380" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="var(--accent-ink)" font-family="var(--display)">"THE REWRITE IS CORRECT"</text>
  <text x="380" y="72" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">a claim somebody will act on</text>
</g>
<!-- threads down to sources -->
<g class="threads" fill="none" stroke-width="2.5">
  <path class="th t1" d="M310 88 C 300 140, 190 150, 150 196" stroke="var(--accent)"/>
  <path class="th t2" d="M350 88 C 346 140, 320 150, 300 196" stroke="var(--accent)"/>
  <path class="th t3" d="M410 88 C 414 140, 440 150, 460 196" stroke="var(--accent)"/>
  <path class="th t4 frayed" d="M450 88 C 460 140, 570 150, 612 196" stroke="var(--fail)" stroke-dasharray="7 8"/>
</g>
<!-- sources -->
<g font-family="var(--mono)" font-size="9.5" text-anchor="middle">
  <g><rect x="98" y="196" width="104" height="52" rx="6" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2"/><text x="150" y="218" fill="var(--ink-2)">run log</text><text x="150" y="234" fill="var(--ink-3)">2026-08-20</text></g>
  <g><rect x="248" y="196" width="104" height="52" rx="6" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2"/><text x="300" y="218" fill="var(--ink-2)">frozen limits</text><text x="300" y="234" fill="var(--ink-3)">set before run</text></g>
  <g><rect x="408" y="196" width="104" height="52" rx="6" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2"/><text x="460" y="218" fill="var(--ink-2)">reference</text><text x="460" y="234" fill="var(--ink-3)">independent</text></g>
  <g><rect x="560" y="196" width="104" height="52" rx="6" fill="var(--fail-soft,var(--paper-2))" stroke="var(--fail)" stroke-width="2" stroke-dasharray="5 5"/><text x="612" y="218" fill="var(--fail)">nothing</text><text x="612" y="234" fill="var(--fail)">holds this one</text></g>
</g>
<text x="380" y="278" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--body)">Pull any thread and see what is on the end of it. One thread here goes nowhere.</text>
<text x="380" y="296" text-anchor="middle" font-size="11" fill="var(--accent-ink)" font-family="var(--mono)">provenance shows you the strings · it does not tie them for you</text>
</svg><figcaption>Provenance shows you the strings. It does not tie them for you.</figcaption></figure>

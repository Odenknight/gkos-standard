<figure class="art art-outcomes-faders" aria-labelledby="outcomes-faders-t outcomes-faders-d"><svg viewBox="0 0 760 290" role="img" xmlns="http://www.w3.org/2000/svg"><title id="outcomes-faders-t">A single failure switch beside a mixing desk of five independent faders set at different levels</title><desc id="outcomes-faders-d">On the left, a large toggle switch is set to FAIL, labelled one switch. On the right, a mixing desk holds five faders labelled parity, f64, f32, speed and next step, each set at a different height and colour, captioned five independent settings from one run.</desc>
<g class="sw">
  <rect x="60" y="56" width="150" height="180" rx="10" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2.5"/>
  <rect x="106" y="94" width="58" height="104" rx="28" fill="var(--paper-3)" stroke="var(--ink-3)" stroke-width="2.5"/>
  <circle class="knob" cx="135" cy="170" r="22" fill="var(--fail)"/>
  <text x="135" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="var(--fail)" font-family="var(--display)">FAIL</text>
  <text x="135" y="42" text-anchor="middle" font-size="10.5" fill="var(--ink-3)" font-family="var(--mono)">one switch</text>
</g>
<text x="256" y="150" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink-3)" font-family="var(--display)">vs</text>
<g class="desk">
  <rect x="306" y="56" width="404" height="180" rx="10" fill="var(--paper-2)" stroke="var(--accent)" stroke-width="2.5"/>
  <g class="faders">
    <g><rect x="340" y="82" width="8" height="120" rx="4" fill="var(--paper-3)"/><rect class="cap" x="330" y="92" width="28" height="14" rx="4" fill="var(--pass)"/><text x="344" y="222" text-anchor="middle" font-size="8.5" fill="var(--ink-3)" font-family="var(--mono)">parity</text></g>
    <g><rect x="410" y="82" width="8" height="120" rx="4" fill="var(--paper-3)"/><rect class="cap" x="400" y="98" width="28" height="14" rx="4" fill="var(--pass)"/><text x="414" y="222" text-anchor="middle" font-size="8.5" fill="var(--ink-3)" font-family="var(--mono)">f64</text></g>
    <g><rect x="480" y="82" width="8" height="120" rx="4" fill="var(--paper-3)"/><rect class="cap" x="470" y="178" width="28" height="14" rx="4" fill="var(--fail)"/><text x="484" y="222" text-anchor="middle" font-size="8.5" fill="var(--ink-3)" font-family="var(--mono)">f32</text></g>
    <g><rect x="550" y="82" width="8" height="120" rx="4" fill="var(--paper-3)"/><rect class="cap" x="540" y="136" width="28" height="14" rx="4" fill="var(--ink-3)"/><text x="554" y="222" text-anchor="middle" font-size="8.5" fill="var(--ink-3)" font-family="var(--mono)">speed</text></g>
    <g><rect x="620" y="82" width="8" height="120" rx="4" fill="var(--paper-3)"/><rect class="cap" x="610" y="112" width="28" height="14" rx="4" fill="var(--time)"/><text x="624" y="222" text-anchor="middle" font-size="8.5" fill="var(--ink-3)" font-family="var(--mono)">next step</text></g>
  </g>
  <text x="508" y="42" text-anchor="middle" font-size="10.5" fill="var(--accent-ink)" font-family="var(--mono)">five independent settings, from one run</text>
</g>
<text x="380" y="272" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--body)">The run did not produce one verdict. It produced five, and they do not agree.</text>
</svg><figcaption>The run did not produce one verdict. It produced five.</figcaption></figure>

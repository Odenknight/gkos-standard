<figure class="art art-engage-doors" aria-labelledby="engage-doors-t engage-doors-d"><svg viewBox="0 0 760 280" role="img" xmlns="http://www.w3.org/2000/svg"><title id="engage-doors-t">Four doors labelled with the four ways to help and the time each one takes</title><desc id="engage-doors-d">Four doors side by side: NAME A PATHWAY, takes 30 seconds; CHECK MY WORK, takes an afternoon; INTRODUCE US, takes one email, highlighted in amber; and SHAPE A PILOT, takes a quarter.</desc>
<path d="M20 232 h720" stroke="var(--ink-3)" stroke-width="3"/>
<g class="dr d1"><rect x="58" y="60" width="142" height="172" rx="4" fill="var(--paper-2)" stroke="var(--accent)" stroke-width="2.5"/><circle cx="182" cy="150" r="5" fill="var(--accent)"/>
  <text x="129" y="112" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--accent-ink)" font-family="var(--display)">NAME A</text>
  <text x="129" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--accent-ink)" font-family="var(--display)">PATHWAY</text>
  <text x="129" y="176" text-anchor="middle" font-size="9" fill="var(--ink-3)" font-family="var(--mono)">takes 30 seconds</text></g>
<g class="dr d2"><rect x="218" y="60" width="142" height="172" rx="4" fill="var(--paper-2)" stroke="var(--accent)" stroke-width="2.5"/><circle cx="342" cy="150" r="5" fill="var(--accent)"/>
  <text x="289" y="112" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--accent-ink)" font-family="var(--display)">CHECK</text>
  <text x="289" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--accent-ink)" font-family="var(--display)">MY WORK</text>
  <text x="289" y="176" text-anchor="middle" font-size="9" fill="var(--ink-3)" font-family="var(--mono)">takes an afternoon</text></g>
<g class="dr d3 open"><rect x="378" y="60" width="142" height="172" rx="4" fill="var(--time-soft)" stroke="var(--time)" stroke-width="3"/><circle cx="502" cy="150" r="5" fill="var(--time)"/>
  <text x="449" y="112" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--time)" font-family="var(--display)">INTRODUCE</text>
  <text x="449" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--time)" font-family="var(--display)">US</text>
  <text x="449" y="176" text-anchor="middle" font-size="9" fill="var(--time)" font-family="var(--mono)">takes one email</text></g>
<g class="dr d4"><rect x="538" y="60" width="142" height="172" rx="4" fill="var(--paper-2)" stroke="var(--accent)" stroke-width="2.5"/><circle cx="662" cy="150" r="5" fill="var(--accent)"/>
  <text x="609" y="112" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--accent-ink)" font-family="var(--display)">SHAPE</text>
  <text x="609" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--accent-ink)" font-family="var(--display)">A PILOT</text>
  <text x="609" y="176" text-anchor="middle" font-size="9" fill="var(--ink-3)" font-family="var(--mono)">takes a quarter</text></g>
<text x="380" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)" font-family="var(--display)">Four doors. All of them unlocked from your side.</text>
<text x="380" y="266" text-anchor="middle" font-size="11.5" fill="var(--ink-3)" font-family="var(--body)">Pick by how much time you actually have, not by how important it sounds.</text>
</svg><figcaption>Four doors, all unlocked from your side.</figcaption></figure>

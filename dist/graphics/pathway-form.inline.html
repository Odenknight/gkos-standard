<figure class="art art-pathway-form" aria-labelledby="pathway-form-t pathway-form-d"><svg viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><title id="pathway-form-t">An application form with name and project completed and a required institution field left empty and flagged</title><desc id="pathway-form-d">A form titled APPLICATION has Name and Project filled in. A third field, Institution, marked with a red asterisk, is empty and outlined in red with a blinking cursor. Below: asterisk required, cannot continue.</desc>
<rect x="150" y="28" width="460" height="244" rx="10" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2.5"/>
<text x="180" y="62" font-size="13" font-weight="700" fill="var(--ink-2)" font-family="var(--display)">APPLICATION</text>
<g font-family="var(--mono)" font-size="10.5" fill="var(--ink-3)">
  <text x="180" y="98">Name</text><rect x="180" y="106" width="400" height="22" rx="4" fill="var(--paper-3)"/>
  <text x="188" y="122" fill="var(--ink-2)">filled in</text>
  <text x="180" y="152">Project</text><rect x="180" y="160" width="400" height="22" rx="4" fill="var(--paper-3)"/>
  <text x="188" y="176" fill="var(--ink-2)">filled in</text>
  <text x="180" y="206" fill="var(--fail)">Institution *</text>
  <rect class="blank" x="180" y="214" width="400" height="22" rx="4" fill="none" stroke="var(--fail)" stroke-width="2.5"/>
</g>
<g class="err"><text x="180" y="256" font-size="11" fill="var(--fail)" font-family="var(--mono)">* required — cannot continue</text></g>
<g class="cursor"><rect x="188" y="217" width="2" height="16" fill="var(--fail)"/></g>
<text x="380" y="292" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--body)">One field, and the whole form is unreachable. That is the barrier, stated exactly.</text>
</svg><figcaption>One required field, and the whole form is unreachable.</figcaption></figure>

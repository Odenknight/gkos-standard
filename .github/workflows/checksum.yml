name: Release checksums
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
permissions: {contents: read}
# Only newer commits to the same PR supersede running validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checksums:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","r720-ci"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify published release checksums
        run: |
          set -e
          for f in releases/*/SHA256SUMS.txt; do
            [ -f "$f" ] || continue
            (cd "$(dirname "$f")" && sha256sum -c SHA256SUMS.txt)
          done
      - name: Verify release-candidate checksums
        run: |
          set -e
          for f in release-candidates/*/SHA256SUMS.txt; do
            [ -f "$f" ] || continue
            (cd "$(dirname "$f")" && sha256sum -c SHA256SUMS.txt)
          done

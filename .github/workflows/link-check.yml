name: Link check
on: [push, pull_request]
permissions: {contents: read}
jobs:
  links:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","r720-ci"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Check links with pinned Lychee
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/check-links.sh

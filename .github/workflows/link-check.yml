name: Link check
on: [push, pull_request]
permissions: {contents: read}
jobs:
  links:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","r720-ci"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # Archived documents preserve their release-era relative links and are
          # intentionally excluded from the live-document integrity gate.
          args: >-
            --no-progress
            --verbose
            --exclude-path archive
            --exclude-path docs/archive
            --exclude-path docs/implementation/archive
            --exclude-path fixtures/archive
            --exclude-path schemas/archive
            # These verified primary-source pages reject automated HEAD/GET
            # requests with 403. Keep the links in docs; exclude only these URLs.
            --exclude '^https://www\\.hhs\\.gov/hipaa/for-professionals/faq/2003/are-we-required-to-certify-our-organizations-compliance-with-the-standards/index\\.html            "**/*.md"

            --exclude '^https://ansi\\.org/american-national-standards/ans-introduction/essential-requirements/?            "**/*.md"

            "**/*.md"

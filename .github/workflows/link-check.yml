name: Link check
on: [push, pull_request]
permissions: {contents: read}
jobs:
  links:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","r720-ci"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # Archived documents preserve their release-era relative links.
          # The two exact primary-source URLs reject automated checks with 403.
          args: >-
            --no-progress
            --verbose
            --exclude-path archive
            --exclude-path docs/archive
            --exclude-path docs/implementation/archive
            --exclude-path fixtures/archive
            --exclude-path schemas/archive
            --exclude-path '(^|/)conformance/evidence/eu-ai-p1\.1-20260907/run-01/specification\.md$'
            --exclude-path '(^|/)conformance/evidence/eu-ai-p1\.1-20260907/run-02/specification\.md$'
            --exclude "https://www\\.hhs\\.gov/hipaa/for-professionals/faq/2003/are-we-required-to-certify-our-organizations-compliance-with-the-standards/index\\.html"
            --exclude "https://ansi\\.org/american-national-standards/ans-introduction/essential-requirements"
            "**/*.md"
      # The exact immutable captures above use their original source link base.
      # This also verifies their hashes; live specifications remain in lychee.
      - name: Verify captured evidence and original specification link base
        run: node scripts/check-eu-ai-p1-evidence.mjs

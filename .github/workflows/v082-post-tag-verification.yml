name: v0.82 post-tag verification

on:
  push:
    tags:
      - v0.82
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v082-tag:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","r720-ci"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/v0.82
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Uses the REST API through Node rather than the gh CLI or jq, which the
      # self-hosted runner does not provide.
      - name: Verify annotated GitHub-verified tag and resolve commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_sha="$(node --input-type=module -e '
            const repo = process.env.GITHUB_REPOSITORY;
            const api = async p => {
              const r = await fetch(`https://api.github.com/repos/${repo}/${p}`, {
                headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: "application/vnd.github+json" },
              });
              if (!r.ok) throw new Error(`${p}: HTTP ${r.status}`);
              return r.json();
            };
            const ref = await api("git/ref/tags/v0.82");
            if (ref.object.type !== "tag") throw new Error(`v0.82 must be an annotated tag object, found ${ref.object.type}`);
            const tag = await api(`git/tags/${ref.object.sha}`);
            if (tag.verification?.verified !== true) throw new Error("GitHub does not report the v0.82 annotated tag signature as verified");
            if (tag.object.type !== "commit") throw new Error("v0.82 tag does not target a commit");
            console.log(tag.object.sha);
          ')"
          git_target="$(git rev-list -n1 v0.82)"
          test "$target_sha" = "$git_target" || {
            echo "GitHub tag-object target and git resolution differ" >&2
            exit 1
          }
          echo "EXPECTED_TAG_TARGET=$target_sha" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$target_sha"
          git merge-base --is-ancestor "$target_sha" origin/main
          echo "verified annotated v0.82 tag target: $target_sha"
      - name: Validate published v0.82 package
        run: bash scripts/check-current-release.sh
      - name: Verify final release checksums
        run: |
          set -euo pipefail
          release_dir="$(find releases -maxdepth 1 -type d -name '*-v0.82' -print)"
          test "$(printf '%s\n' "$release_dir" | grep -c .)" -eq 1
          (cd "$release_dir" && sha256sum -c SHA256SUMS.txt)

name: R720 runner smoke

on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/r720-runner-smoke.yml']

permissions: {contents: read}

concurrency:
  group: r720-smoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner_label: [r720-ci-632, r720-ci-633, r720-ci-634, r720-ci-635]
    runs-on: [self-hosted, Linux, X64, '${{ matrix.runner_label }}']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate guest runtime and Docker
        run: |
          hostname
          df -h /
          docker run --rm hello-world
      - name: Run real conformance tests
        working-directory: conformance/runner
        run: |
          npm ci
          npm test
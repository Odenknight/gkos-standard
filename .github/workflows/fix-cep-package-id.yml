name: Repair CEP package ID boundary

on:
  push:
    branches:
      - work/r20-r21-ecosystem-20260902

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reject SHA-256 digests as package-instance IDs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('schemas/provisional/evidence/gkos-conformance-evidence-package-0.1.draft.schema.json')
          text = path.read_text(encoding='utf-8')
          old = '"pattern": "^[a-z][a-z0-9_.-]*:[a-z0-9][a-z0-9_.:/-]{2,}$"'
          new = '"pattern": "^(?!sha256:)[a-z][a-z0-9_.-]*:[a-z0-9][a-z0-9_.:/-]{2,}$"'
          if new in text:
              print('schema boundary already repaired')
          elif old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('repaired package_id namespaced-ID boundary')
          else:
              raise SystemExit('expected schema pattern not found')
          PY
          git diff --check
      - name: Commit bounded schema repair
        shell: bash
        run: |
          git config user.name 'Shaun "Oden" Marshall'
          git config user.email '40664141+Odenknight@users.noreply.github.com'
          git add schemas/provisional/evidence/gkos-conformance-evidence-package-0.1.draft.schema.json
          if git diff --cached --quiet; then
            echo 'No schema change was required.'
            exit 0
          fi
          git commit -m 'fix: reject content digests as CEP package IDs' \
            -m 'Signed-off-by: Shaun "Oden" Marshall <40664141+Odenknight@users.noreply.github.com>'
          git push origin HEAD:work/r20-r21-ecosystem-20260902

name: Conformance runner

on: [push, pull_request]

permissions: {contents: read}

jobs:
  dependency-audit:
    name: blocking dependency audit / Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: conformance/runner/package-lock.json
      - name: Install exact runner dependencies
        working-directory: conformance/runner
        run: npm ci
      - name: Reject high or critical dependency findings
        working-directory: conformance/runner
        run: npm audit --audit-level=high

  test:
    name: blocking ${{ matrix.os }} / Node ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: conformance/runner/package-lock.json
      - name: Install runner dependencies
        working-directory: conformance/runner
        run: npm ci
      - name: Test runner claim boundaries
        working-directory: conformance/runner
        run: npm test

  node-23-informative:
    name: informative ubuntu-latest / Node 23
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 23
          cache: npm
          cache-dependency-path: conformance/runner/package-lock.json
      - name: Install runner dependencies
        working-directory: conformance/runner
        run: npm ci
      - name: Test runner claim boundaries (informative only)
        working-directory: conformance/runner
        run: npm test

name: XW-002 consistency

on:
  push:
    branches: [main]
    tags: ['**']
    paths:
      - "docs/GKOS_ISO42001_NIST_AIRMF_CROSSWALK.md"
      - "docs/ecosystem/EXTERNAL_CROSSWALK.json"
      - "scripts/xw002/**"
      - ".github/workflows/xw002-consistency.yml"
  pull_request:
    paths:
      - "docs/GKOS_ISO42001_NIST_AIRMF_CROSSWALK.md"
      - "docs/ecosystem/EXTERNAL_CROSSWALK.json"
      - "scripts/xw002/**"
      - ".github/workflows/xw002-consistency.yml"

permissions:
  contents: read

# Only newer commits to the same PR supersede running validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generated-representations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject duplicate, missing and invalid crosswalk rows
        run: python -m unittest discover -s scripts/xw002 -p "test_*.py"
      - name: Verify prose and JSON are generated from the reviewed row source
        run: python scripts/xw002/gen.py --check

name: Normalize R21 Markdown EOF

on:
  push:
    branches:
      - work/r20-r21-ecosystem-20260902

permissions:
  contents: write
  actions: write

jobs:
  normalize:
    if: ${{ contains(github.event.head_commit.message, 'chore: normalize R21 text files') == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Add one terminal newline where missing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in sorted(Path('.').rglob('*.md')):
              if '.git' in path.parts:
                  continue
              data = path.read_bytes()
              if not data.endswith(b'\n'):
                  path.write_bytes(data + b'\n')
                  changed.append(path.as_posix())
          print(f'normalized {len(changed)} Markdown files')
          for path in changed:
              print(path)
          PY
      - name: Remove one-time workflow and verify patch
        shell: bash
        run: |
          rm .github/workflows/normalize-r21-eof.yml
          git diff --check
      - name: Commit and push bounded mechanical repair
        shell: bash
        run: |
          git config user.name 'Shaun "Oden" Marshall'
          git config user.email '40664141+Odenknight@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'No normalization changes were required.'
            exit 0
          fi
          git commit -m 'chore: normalize R21 text files' \
            -m 'Signed-off-by: Shaun "Oden" Marshall <40664141+Odenknight@users.noreply.github.com>'
          git push origin HEAD:work/r20-r21-ecosystem-20260902
